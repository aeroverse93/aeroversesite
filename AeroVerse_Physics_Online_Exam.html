nswer":2,"answerText":"3 times its fundamental frequency.","explanation":"1st harmonic = 1 * fundamental frequency. 2nd harmonic = 2 * fundamental frequency. 3rd harmonic = 3 fundamental frequency."},{"topic":"5. Wave Motion and Sound.","sourceNumber":31,"q":"The varying pitch of the sound of a train passing by is caused by a phenomenon known as.","options":["Doppler effect.","double frequency.","resonance."],"answer":0,"answerText":"Doppler effect.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":32,"q":"Wavelength is.","options":["distance from trough to crest.","distance between crests.","distance between top and bottom."],"answer":1,"answerText":"distance between crests.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":33,"q":"The speed of sound at standard atmospheric temperature and pressure is.","options":["34 Km/s.","340 m/s.","340 Km/s."],"answer":1,"answerText":"340 m/s.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":34,"q":"In which medium does sound travel the fastest?.","options":["Steel.","Air.","Water."],"answer":0,"answerText":"Steel.","explanation":"Fastest to slowest - Solid, liquid, gas."},{"topic":"5. Wave Motion and Sound.","sourceNumber":35,"q":"Which has the most effect on the speed of sound in air?.","options":["Temperature.","Wavelength.","Frequency."],"answer":0,"answerText":"Temperature.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":36,"q":"The fundamental frequency of a control cable is 10 Hz, the frequency of the 2nd Harmonic is.","options":["20 Hz.","20 KHz.","10 Hz."],"answer":0,"answerText":"20 Hz.","explanation":"2nd harmonic = 2* fundamental frequency."},{"topic":"5. Wave Motion and Sound.","sourceNumber":37,"q":"Which of the following is an example of a Longitudinal Wave?.","options":["Sound Wave.","Radio Wave.","Light Wave."],"answer":0,"answerText":"Sound Wave.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":38,"q":"What is the wavelength of a note of frequency 1kHz when its velocity is 340m/s?.","options":["3.4m.","0.34m.","0.34km."],"answer":1,"answerText":"0.34m.","explanation":"V = f λ λ=V/f =340/1000 (answer in SI units of metres). 6."},{"topic":"5. Wave Motion and Sound.","sourceNumber":1,"q":"A body drops from 10m, it will hit the ground in.","options":["√2 seconds.","2 seconds.","1 Second."],"answer":0,"answerText":"√2 seconds.","explanation":"s = ut + ½ at2 s = 1/2at2 since u = 0 10 = ½(10)t2 since a = 10 (approx.) t = √(10/5) = √2."},{"topic":"5. Wave Motion and Sound.","sourceNumber":2,"q":"What height of water is equivalent to 1 atmosphere?.","options":["29ft.","101ft.","33ft."],"answer":2,"answerText":"33ft.","explanation":"Approximately 10 m (33 ft) depth of water = 1 atmosphere."},{"topic":"5. Wave Motion and Sound.","sourceNumber":3,"q":"10 BTU is equivalent to.","options":["63,560 Joules.","10,550 Joules.","570 Joules."],"answer":1,"answerText":"10,550 Joules.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":4,"q":"What does 'temperature of a body' mean?.","options":["Its hotness.","How it radiates heat.","Its ability to retain heat."],"answer":0,"answerText":"Its hotness.","explanation":"NIL. http://www.answers.com/topic/temperature"}];
const topicSelect=document.getElementById('topic'), countSelect=document.getElementById('count'), minutesSelect=document.getElementById('minutes');
const uniqueTopics=[...new Set(questionBank.map(q=>q.topic))];
uniqueTopics.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;topicSelect.appendChild(o)});
document.getElementById('bankInfo').textContent=`Loaded ${questionBank.length} questions from the PDF. Select a topic or practise the full bank.`;
let exam=[],answers={},index=0,remaining=0,tick=null,submitted=false;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startExam(){if(tick)clearInterval(tick);let pool=questionBank.filter(q=>topicSelect.value==='all'||q.topic===topicSelect.value);if(!pool.length){alert('No questions found for this topic.');return}pool=shuffle([...pool]);const n=countSelect.value==='all'?pool.length:Math.min(Number(countSelect.value),pool.length);exam=pool.slice(0,n);answers={};index=0;submitted=false;remaining=Number(minutesSelect.value)*60;$('setup').classList.add('hidden');$('results').classList.add('hidden');$('exam').classList.remove('hidden');if(remaining>0){showTime();tick=setInterval(()=>{remaining--;showTime();if(remaining<=0){clearInterval(tick);finishExam(true)}},1000)}else $('timer').textContent='No timer';render()}
function showTime(){$('timer').textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;$('timer').style.background=remaining<=60?'#ffe1e1':'#eaf4fb';$('timer').style.color=remaining<=60?'#a11':'#15578a'}
function render(){const q=exam[index];$('counter').textContent=`Question ${index+1} of ${exam.length}`;$('topicTag').textContent=q.topic;$('sourceNum').textContent=`Source question ${q.sourceNumber}`;$('question').textContent=q.q;$('options').innerHTML='';q.options.forEach((op,j)=>{const lab=document.createElement('label');lab.className='option'+(answers[index]===j?' selected':'');const inp=document.createElement('input');inp.type='radio';inp.name='answer';inp.checked=answers[index]===j;inp.addEventListener('change',()=>{answers[index]=j;render()});const span=document.createElement('span');span.textContent=String.fromCharCode(65+j)+'. '+op;lab.append(inp,span);$('options').appendChild(lab)});$('prev').disabled=index===0;$('next').disabled=index===exam.length-1;$('answered').textContent=`Answered ${Object.keys(answers).length} / ${exam.length}`;$('bar').style.width=`${(index+1)/exam.length*100}%`;$('numbers').innerHTML='';exam.forEach((_,i)=>{const b=document.createElement('button');b.className='num'+(answers[i]!==undefined?' done':'')+(i===index?' current':'');b.textContent=i+1;b.addEventListener('click',()=>{index=i;render()});$('numbers').appendChild(b)})}
function finishExam(auto=false){if(submitted)return;if(!auto&&!confirm('Submit your exam now?'))return;submitted=true;if(tick)clearInterval(tick);let score=0,gradable=0;exam.forEach((q,i)=>{if(q.answer>=0){gradable++;if(answers[i]===q.answer)score++}});$('exam').classList.add('hidden');$('results').classList.remove('hidden');const pct=gradable?Math.round(score/gradable*100):0;let out=`<div class="row"><div><span class="pill">${auto?'Time is up':'Exam submitted'}</span><h2 style="margin:10px 0 4px">Your result</h2><div style="font-size:28px;font-weight:bold">${score} / ${gradable} (${pct}%)</div><p class="muted">Unanswered: ${exam.length-Object.keys(answers).length}. Questions without a clear matching answer in the source are excluded from the score.</p></div><button id="again">New exam</button></div><hr style="border:0;border-top:1px solid #dce5ef;margin:18px 0"><h3>Answer review</h3>`;exam.forEach((q,i)=>{const your=answers[i];const good=q.answer>=0&&your===q.answer;out+=`<div class="review-item"><strong>${i+1}. ${escapeHtml(q.q)}</strong><p class="${good?'correct':'wrong'}">${your===undefined?'Not answered':good?'Correct':'Your answer: '+String.fromCharCode(65+your)+'. '+escapeHtml(q.options[your])}</p><p><strong>Correct answer:</strong> ${q.answer>=0?String.fromCharCode(65+q.answer)+'. '+escapeHtml(q.options[q.answer]):escapeHtml(q.answerText)+' <em>(source answer did not exactly match an option)</em>'}</p>${q.explanation?`<p class="muted"><strong>Explanation:</strong> ${escapeHtml(q.explanation)}</p>`:''}</div>`});$('results').innerHTML=out;$('again').addEventListener('click',()=>{ $('results').classList.add('hidden');$('setup').classList.remove('hidden')})}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('start').addEventListener('click',startExam);$('prev').addEventListener('click',()=>{if(index>0){index--;render()}});$('next').addEventListener('click',()=>{if(index<exam.length-1){index++;render()}});$('submit').addEventListener('click',()=>finishExam(false));
</script></body></html>
