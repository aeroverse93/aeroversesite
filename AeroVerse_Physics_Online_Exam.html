gained at a greater rate than kinetic energy is lost.","kinetic energy is gained at the same rate as potential energy is lost.","kinetic energy is gained at a greater rate than potential energy is lost."],"answer":1,"answerText":"kinetic energy is gained at the same rate as potential energy is lost.","explanation":"KE gained = PE lost (at the same rate). 2.3b. Mechanics – Dynamics."},{"topic":"1. Matter.","sourceNumber":1,"q":"A good refrigerant has a.","options":["low condensation temperature and high condensation pressure.","low condensation temperature and low condensation pressure.","high condensation temperature and low condensation pressure."],"answer":2,"answerText":"high condensation temperature and low condensation pressure.","explanation":""},{"topic":"1. Matter.","sourceNumber":2,"q":"What is the momentum of a ball of mass 2 grams and has a velocity of 10cm/s?.","options":["5 kg.m/s.","20 kg.m/s.","0.0002 kg.m/s."],"answer":2,"answerText":"0.0002 kg.m/s.","explanation":"Momentum = mass * velocity. But first convert the numbers to SI. (2 grammes = 2/1000 kg. 10cm = 10/1000 Metres)."},{"topic":"1. Matter.","sourceNumber":3,"q":"A gyroscope suffers from apparent wander. This is due to.","options":["friction on the gimbals and bearings.","the earth's rotation.","the aircraft flying along a north/south track."],"answer":1,"answerText":"the earth's rotation.","explanation":"Real wander is physical movement from friction in bearings. Apparent wander is due to effect of earth's rotation."},{"topic":"1. Matter.","sourceNumber":4,"q":"The SI unit of momentum is the.","options":["metre squared (m2).","kilogram metre per second.","kilogram / metre (kg/m)."],"answer":1,"answerText":"kilogram metre per second.","explanation":"Momentum = mass * velocity. So units are kg m/s."},{"topic":"1. Matter.","sourceNumber":5,"q":"Precession in a gyro is.","options":["proportional to the magnitude of the torque applied.","proportional to the square of the magnitude of the torque applied.","inversely proportional to the magnitude of the torques applied."],"answer":0,"answerText":"proportional to the magnitude of the torque applied.","explanation":""},{"topic":"1. Matter.","sourceNumber":6,"q":"A gyro with a fixed point free to rotate in three axis is.","options":["a tied gyro.","a space gyro.","an earth gyro."],"answer":0,"answerText":"a tied gyro.","explanation":"If the gyro is fixed to one point, it is a tied gyro. (An earth gyro is 'tied' specifically to an earth reference point)."},{"topic":"1. Matter.","sourceNumber":7,"q":"What type of friction requires the greatest force to overcome it?.","options":["Dynamic friction.","Static friction.","Rolling friction."],"answer":1,"answerText":"Static friction.","explanation":"Static friction (sometimes called 'stiction') is the greatest friction. Followed by Dynamic and Rolling respectively."},{"topic":"1. Matter.","sourceNumber":8,"q":"If a gyro is constrained to an external reference and has three degrees of freedom it is.","options":["a tied gyro.","an earth gyro.","a space gyro."],"answer":0,"answerText":"a tied gyro.","explanation":"A tied gyro has one axis fixed to a point (in space or on earth). An earth gyro is a tied gyro but with one axis specifically fixed to a reference on earth."},{"topic":"1. Matter.","sourceNumber":9,"q":"The point at which an applied force overcomes friction and an object begins to move is the co-efficient of.","options":["limiting friction.","static friction.","kinetic friction."],"answer":0,"answerText":"limiting friction.","explanation":""},{"topic":"1. Matter.","sourceNumber":10,"q":"The amount a gyro precesses when a torque is applied is.","options":["proportional to the torque.","inversely proportional to the torque.","proportional to the square of the torque."],"answer":0,"answerText":"proportional to the torque.","explanation":""},{"topic":"1. Matter.","sourceNumber":11,"q":"The gyroscopic principle is based upon.","options":["Newton’s 3rd Law.","Newton’s 2nd Law.","Newton’s 1st Law."],"answer":2,"answerText":"Newton’s 1st Law.","explanation":"Newton's First Law is also called the 'Inertia Law'."},{"topic":"1. Matter.","sourceNumber":12,"q":"A mass of 20kg produces a momentum of 300kgm/s. What is the Kinetic energy?.","options":["3250 Joules.","2250 Joules.","0.25 Kilojoules."],"answer":1,"answerText":"2250 Joules.","explanation":"Momentum = MV, 300 = 20V, V = 15. KE = 1/2MV2 = 1/2*20*15*15 = 2250J."},{"topic":"1. Matter.","sourceNumber":13,"q":"A motorcycle of mass 400kg is moving at a velocity of 8m/s. Calculate its momentum.","options":["3200 kgm/s.","50 kgm/s.","320 kgm/s."],"answer":0,"answerText":"3200 kgm/s.","explanation":"Momentum = mass * velocity."},{"topic":"1. Matter.","sourceNumber":14,"q":"If the speed of a gyro is increased, the force required to precess the gyro is.","options":["increased.","remains the same.","decreased."],"answer":0,"answerText":"increased.","explanation":"Rigidity increases with RPM. 2.4a. Mechanics - Fluid Dynamics."},{"topic":"1. Matter.","sourceNumber":1,"q":"The specific gravity of a substance is calculated by.","options":["density of the body squared multiplied by the density of water.","the density of the body divided by the density of water.","density of the body multiplied by the density of water."],"answer":1,"answerText":"the density of the body divided by the density of water.","explanation":"Specific' always means 'per' something or divide by."},{"topic":"1. Matter.","sourceNumber":2,"q":"The SI unit of density is the.","options":["kilogram per cubic metre (kg/m3).","Pascal (Pa).","cubic metre (m3)."],"answer":0,"answerText":"kilogram per cubic metre (kg/m3).","explanation":""},{"topic":"1. Matter.","sourceNumber":3,"q":"Relative density is.","options":["density of water x density of medium.","density of water/density of medium.","density of medium/density of water."],"answer":2,"answerText":"density of medium/density of water.","explanation":""},{"topic":"1. Matter.","sourceNumber":4,"q":"The standard for measuring density is.","options":["0 °C and 760 mm of mercury.","-20 °C and 700 mm of mercury.","+20 °C and 760 mm of mercury."],"answer":0,"answerText":"0 °C and 760 mm of mercury.","explanation":"STP."},{"topic":"1. Matter.","sourceNumber":5,"q":"1kg of water is heated from 0 °C to 2 °C. Its volume will.","options":["decrease.","stay the same.","increase."],"answer":0,"answerText":"decrease.","explanation":"When ice melts, its volume decreases up to 3 °C."},{"topic":"1. Matter.","sourceNumber":6,"q":"A pilot requests 9.2 tonnes of fuel. The bowser driver reports to the pilot that the specific gravity is 0.8, what will the uplift be?.","options":["7360 litres.","11500 litres.","9200 litres."],"answer":1,"answerText":"11500 litres.","explanation":"1 litre of water has a mass of 1kg. 1000 litres of water has a mass of 1 metric tonne. 9.2 tonnes of water is 9200 litres. But fuel is lighter than water (0.8x) so the uplift will be more than 9200 litres."},{"topic":"1. Matter.","sourceNumber":7,"q":"Specific gravity.","options":["is measured in kg/m2.","is measured in kg/m3.","has no units."],"answer":2,"answerText":"has no units.","explanation":"Specific gravity is the density of the fluid divided by the density of water. Since both have the same units (kg/m3) they cancel - hence, no units."},{"topic":"1. Matter.","sourceNumber":8,"q":"The standard temperature and pressure for measuring the density of liquids is.","options":["15 °C and 760 mmHg.","0 °C and 760 mmHg.","4 °C and 760 mmHg."],"answer":2,"answerText":"4 °C and 760 mmHg.","explanation":"Since water is most dense at 4 °C (1000 kg/m3), this is used as the standard temperature. When working out specific gravity, the fluid in question must also be 4 °C. (But remember it is 0 °C for gases, and room temp - 20 °C - for barometers)."},{"topic":"1. Matter.","sourceNumber":9,"q":"The standard temperature and pressure for measuring the volume of liquids and solids is.","options":["20 °C and 700 mmHg.","20 °C and 760 mmHg.","0 °C and 760 mmHg."],"answer":1,"answerText":"20 °C and 760 mmHg.","explanation":"Since the volume of solids and gases changes with temperature (and a lesser amount with pressure) the standard for measuring volume is 20 °C. (room temp.) and 760mmHg (standard sea level atmospheric pressure)."},{"topic":"1. Matter.","sourceNumber":10,"q":"Given that 1 cubic foot of water weighs 62.4 lbs and the specific gravity of fuel is 0.81, what is the weight of 10 cubic foot of fuel?.","options":["402.8 lbs.","505.4 lbs.","770.3 lbs."],"answer":1,"answerText":"505.4 lbs.","explanation":"10 * 62.4 = 624. 624 * 081 =."},{"topic":"1. Matter.","sourceNumber":11,"q":"At what temperature does water have the greatest density?.","options":["0 °C.","100 °C.","4 °C."],"answer":2,"answerText":"4 °C.","explanation":"Solidification begins at 4 °C when cooling."},{"topic":"1. Matter.","sourceNumber":12,"q":"The specific gravity of methylated spirit is 0.8. Its density is.","options":["800 g/m3.","800 kg/m3.","80 kg/m3."],"answer":1,"answerText":"800 kg/m3.","explanation":"sg = density of fluid/density of water density of fluid = sg * density of water density of water = 1000 kg/m3."},{"topic":"1. Matter.","sourceNumber":13,"q":"The density of Cu is 8,900kg/m3. What is its relative density?.","options":["890.","8.9.","89."],"answer":1,"answerText":"8.9.","explanation":"rel. density = density of substance/density of water= 8900/1000. 2.4b. Mechanics - Fluid Dynamics."},{"topic":"1. Matter.","sourceNumber":1,"q":"Atmospheric pressure at ISA conditions is.","options":["1013 pa.","1013 bar.","1013 mBar."],"answer":2,"answerText":"1013 mBar.","explanation":""},{"topic":"1. Matter.","sourceNumber":2,"q":"Convert 220 gallons to litres.","options":["1000 litres.","48.4 litres.","500 litres."],"answer":0,"answerText":"1000 litres.","explanation":"Imagine how many times a large coke bottle goes into a normal engine oil container (about 4 (and a bit)), then * 220. http://www.metric-conversions.org/"},{"topic":"1. Matter.","sourceNumber":3,"q":"The SI unit of pressure is the.","options":["Newton per metre squared (N/m2).","Cubic metre (m3).","kilogram per metre cubed (kg/m3)."],"answer":0,"answerText":"Newton per metre squared (N/m2).","explanation":"Pressure = force / area. So units of pressure is Newtons / square metre (or better known as Pascals)."},{"topic":"1. Matter.","sourceNumber":4,"q":"A gauge indicates 15 PSIG. What is the absolute pressure?.","options":["30 PSI.","0.3 PSI.","Zero PSI."],"answer":0,"answerText":"30 PSI.","explanation":"Absolute pressure = gauge pressure + atmospheric pressure. (The G in PSIG means 'gauge') Atmospheric pressure varies slightly so is not always the 14.7 PSI of the ISA. http://en.wikipedia.org/wiki/Pound-force_per_square_inch"},{"topic":"1. Matter.","sourceNumber":5,"q":"Water is most dense at.","options":["-4 °C.","0 °C.","+4 °C."],"answer":0,"answerText":"+4 °C.","explanation":"As water cools, the molecules begin to crystallise at 4 °C. Crystallized water (i.e. ice) has a greater volume than liquid water and therefore less density (that is why ice floats). http://www.physicalgeography.net/fundamentals/8a.html"},{"topic":"1. Matter.","sourceNumber":6,"q":"Viscosity can be described as.","options":["Newton's 1st law of motion.","fluids flowing in a straight line.","the internal resistance for a fluid to flow."],"answer":2,"answerText":"the internal resistance for a fluid to flow.","explanation":"Viscosity is opposition to flow of a fluid."},{"topic":"1. Matter.","sourceNumber":7,"q":"How much lift is produced on a wing can be derived from.","options":["Bernoulli's Theorem.","Faraday's law.","Charles law."],"answer":0,"answerText":"Bernoulli's Theorem.","explanation":"Bernoulli's theorem."},{"topic":"1. Matter.","sourceNumber":8,"q":"Pressure in a pipe is.","options":["force per unit area.","mass divided by cross-sectional area.","weight per unit area."],"answer":0,"answerText":"force per unit area.","explanation":"NIL. 3a. Thermodynamics."},{"topic":"3a. Thermodynamics.","sourceNumber":1,"q":"Convert 25 degrees centigrade to fahrenheit.","options":["57.","77.","-7."],"answer":1,"answerText":"77.","explanation":"(25*1.8)+32= 77."},{"topic":"3a. Thermodynamics.","sourceNumber":2,"q":"You are at the north pole where the temperature is minus 50 °C below freezing. What sort of thermometer would you use to measure it?.","options":["Water.","Alcohol.","Mercury."],"answer":1,"answerText":"Alcohol.","explanation":""},{"topic":"3a. Thermodynamics.","sourceNumber":3,"q":"Convert 15 °C to °F.","options":["37 °F.","59 °F.","62 °F."],"answer":1,"answerText":"59 °F.","explanation":"ISA sea level temperature 15 °C = 59 °F."},{"topic":"3a. Thermodynamics.","sourceNumber":4,"q":"1 degree rise on the centigrade scale will cause a.","options":["1.8 degree rise in Fahrenheit.","33 degree rise in Fahrenheit.","0.911 degree rise in Fahrenheit."],"answer":0,"answerText":"1.8 degree rise in Fahrenheit.","explanation":""},{"topic":"3a. Thermodynamics.","sourceNumber":5,"q":"1 calorie is equal to.","options":["4 J.","40 J.","400 J."],"answer":0,"answerText":"4 J.","explanation":""},{"topic":"3a. Thermodynamics.","sourceNumber":6,"q":"1 BTU equals.","options":["1055 Joules.","1055 Calorie.","1055 kJ."],"answer":0,"answerText":"1055 Joules.","explanation":""},{"topic":"3a. Thermodynamics.","sourceNumber":7,"q":"Temperature is a measure of.","options":["the amount of friction produced by two mating surfaces.","the amount of vibration of molecules.","the heat energy of particles."],"answer":1,"answerText":"the amount of vibration of molecules.","explanation":"Heat energy applied to an object does not necessarily increase temperature (eg. when melting or evaporating)."},{"topic":"3a. Thermodynamics.","sourceNumber":8,"q":"What temperature scale is used with the combined gas law?.","options":["Absolute.","Fahrenheit.","Celsius."],"answer":0,"answerText":"Absolute.","explanation":"Kelvin (absolute scale) is always used with the combined gas law equation.\";."},{"topic":"3a. Thermodynamics.","sourceNumber":9,"q":"What is 1 btu/lb in joules per kilogram?.","options":["2326 j/kg.","4128 j/kg.","9.18 j/kg."],"answer":0,"answerText":"2326 j/kg.","explanation":"This is referring to specific energy content (J/kg or Btu/lb) of fuel. 1 btu = 1055 J. 1 lb = 2.2 kg. Therefore 1 btu = 2326 J/kg."},{"topic":"3a. Thermodynamics.","sourceNumber":10,"q":"1 CHU = Centigrade Heat Unit = 1400 ft lbs =energy to raise.","options":["1 lb of water by 1 °F.","1 kg of water by 1 °C.","1 lb of water by 1 °C."],"answer":2,"answerText":"1 lb of water by 1 °C.","explanation":"1 CHU is the heat required to raise 1 lb of water 1 degree Centigrade (=1.8 BTU)."},{"topic":"3a. Thermodynamics.","sourceNumber":11,"q":"1 BTU = 778 ft lbs which is the energy required to raise the temperature of.","options":["1 lb of water by 1 °F.","1 kg of water by 1 °F.","1 lb of water by 1 °C."],"answer":0,"answerText":"1 lb of water by 1 °F.","explanation":"1 BTU is the heat required to raise 1 lb of water 1 degree Fahrenheit."},{"topic":"3a. Thermodynamics.","sourceNumber":12,"q":"A temperature of 41 degrees Fahrenheit is, in Centigrade.","options":["9 degrees.","5 degrees.","7 degrees."],"answer":1,"answerText":"5 degrees.","explanation":"C = 5/9(F-32)."},{"topic":"3a. Thermodynamics.","sourceNumber":13,"q":"Heat is described as.","options":["a high temperature.","energy in transit.","the stored energy in a hot body."],"answer":1,"answerText":"energy in transit.","explanation":"Heat is a type of transfer of energy which increases the kinetic energy of the molecules within a body."},{"topic":"3a. Thermodynamics.","sourceNumber":14,"q":"600K is equal to.","options":["853 °C.","873 °C.","326.85 °C."],"answer":2,"answerText":"326.85 °C.","explanation":"Subtract 273.15."},{"topic":"3a. Thermodynamics.","sourceNumber":15,"q":"When gases change temperature/pressure, the scale used is.","options":["Kelvin.","degrees Fahrenheit.","degrees Centigrade."],"answer":0,"answerText":"Kelvin.","explanation":"Always use the Kelvin scale in thermodynamics."},{"topic":"3a. Thermodynamics.","sourceNumber":16,"q":"Convert 100 °C to Kelvin.","options":["173 K.","373 K.","273 K."],"answer":1,"answerText":"373 K.","explanation":"Degrees C to Kelvin - just add 273."},{"topic":"3a. Thermodynamics.","sourceNumber":17,"q":"-40 °C in Fahrenheit is.","options":["72 °F.","8 °F.","-40 °F."],"answer":2,"answerText":"-40 °F.","explanation":"°F = 1.8 °C + 32 1.8(-40) + 32 = -40 °F. Please do not report this as an error."},{"topic":"3a. Thermodynamics.","sourceNumber":18,"q":"Absolute zero is.","options":["0 °C.","273.15 K.","-273.15 °C."],"answer":2,"answerText":"-273.15 °C.","explanation":"Absolute zero is - 273.15 degrees Celsius."},{"topic":"3a. Thermodynamics.","sourceNumber":19,"q":"One degree increment on the Centigrade scale is equal to what increment on the Fahrenheit scale?.","options":["1.8 °F.","33 °F.","12 °F."],"answer":0,"answerText":"1.8 °F.","explanation":"A change of' 1 degree C. it is equal to 'a change of' 1.8 degree F."},{"topic":"3a. Thermodynamics.","sourceNumber":20,"q":"Transfer of heat from a hot area to a cold area is.","options":["conduction.","convection.","radiation."],"answer":0,"answerText":"conduction.","explanation":"Convection is a transfer of 'matter' from one place to another. Radiation is a system which heats up anything in its path. but heat is not 'transferred'."},{"topic":"3a. Thermodynamics.","sourceNumber":21,"q":"Fahrenheit may be converted to Celsius by using the equation.","options":["°C = 5/9 * ( °F - 32).","°C = 5/9 * °F - 32.","°C = 9/5 * °F + 32."],"answer":0,"answerText":"°C = 5/9 * ( °F - 32).","explanation":"°C = 5/9( °F-32). °F = 9/5 °F + 32."},{"topic":"3a. Thermodynamics.","sourceNumber":22,"q":"What is 1 BTU/lb in joules per kilogram?.","options":["4128 joules per kilogram.","9.18 joules per kilogram.","2326 joules per kilogram."],"answer":2,"answerText":"2326 joules per kilogram.","explanation":"1 BTU/lb = 2326 j/kg. This is referring to heat of combustion of fuel."},{"topic":"3a. Thermodynamics.","sourceNumber":23,"q":"Celsius to Fahrenheit is calculated by.","options":["(9/5 * °C) + 32.","(5/9 * °C) + 32.","(5/9 + 32) + °C."],"answer":0,"answerText":"(9/5 * °C) + 32.","explanation":"Remember standard sea level temperature is 15 °C and 59F. Make °C = 15 on each formula above, and see which comes out at 59 °F\"."},{"topic":"3a. Thermodynamics.","sourceNumber":24,"q":"The percentage of nitrogen in air is approximately.","options":["0.62.","0.21.","0.78."],"answer":2,"answerText":"0.78.","explanation":""},{"topic":"3a. Thermodynamics.","sourceNumber":25,"q":"When a system undergoes a complete cycle where the net heat supplied is equal to work done plus a change in internal energy - this is known as.","options":["2nd Law of thermodynamics.","First law of thermodynamics.","Ideal Gas law."],"answer":1,"answerText":"First law of thermodynamics.","explanation":""},{"topic":"3a. Thermodynamics.","sourceNumber":26,"q":"In a heat pump.","options":["the evaporator gains heat during the heating cycle.","the condenser always loses heat.","the pump operates in both directions."],"answer":2,"answerText":"the pump operates in both directions.","explanation":""},{"topic":"3a. Thermodynamics.","sourceNumber":27,"q":"What is -28 °C on the Kelvin scale?.","options":["245 K.","18 K.","291 K."],"answer":0,"answerText":"245 K.","explanation":"-28 + 273 = 245."},{"topic":"3a. Thermodynamics.","sourceNumber":28,"q":"When water freezes, heat energy is.","options":["absorbed.","retained.","released."],"answer":2,"answerText":"released.","explanation":"Freezing is 'exothermic'."},{"topic":"3a. Thermodynamics.","sourceNumber":29,"q":"842 degrees Fahrenheit is equal to.","options":["450 Degrees Celsius.","400 Degrees Celsius.","232.2 degrees Celsius."],"answer":0,"answerText":"450 Degrees Celsius.","explanation":"C = 5/9(F - 32)."},{"topic":"3a. Thermodynamics.","sourceNumber":30,"q":"For a fixed mass of water at sea level ISA conditions and at 10,000ft.","options":["the water will boil at a lower temperature than sea level.","the water will boil at the same temperature as sea level.","the water will boil at a higher temperature than sea level."],"answer":0,"answerText":"the water will boil at a lower temperature than sea level.","explanation":"As pressure drops, so does the boiling temperature."},{"topic":"3a. Thermodynamics.","sourceNumber":31,"q":"Dew point is.","options":["the temperature at which condensation actually occurs.","the temperature below which condensation occurs.","the temperature above which condensation occurs."],"answer":1,"answerText":"the temperature below which condensation occurs.","explanation":""},{"topic":"3a. Thermodynamics.","sourceNumber":32,"q":"By adding impurities to water.","options":["the melting point will increase and the boiling point decrease.","there will be no effect to the melting and boiling points.","the melting point will decrease and the boiling point will increase."],"answer":2,"answerText":"the melting point will decrease and the boiling point will increase.","explanation":""},{"topic":"3a. Thermodynamics.","sourceNumber":33,"q":"Which type of circuit is used when the temperature of the source has insufficient heat for thermocouple application?.","options":["thermistor.","temperature bulb.","balanced bridge."],"answer":0,"answerText":"thermistor.","explanation":""},{"topic":"3a. Thermodynamics.","sourceNumber":34,"q":"Four pounds of gas at a temperature of 17 °C is heated to 89 °C. The specific heat at constant pressure and constant volume are 0.2404 and 0.1718 respectively. Find the heat absorbed by the gas at constant pressure and at constant volume.","options":["70.1 C.H.U. and 50 C.H.U.","49.5 C.H.U. and 69 C.H.U.","69.2 C.H.U. and 49.5 C.H.U."],"answer":2,"answerText":"69.2 C.H.U. and 49.5 C.H.U.","explanation":"Q = mC(T2 -T1), 4 * 0.2404 * 72 = 69.2 CHU, and 4 * 0.1718 * 72 = 49.5 CHU."},{"topic":"3a. Thermodynamics.","sourceNumber":35,"q":"In 'standard conditions' what is the standard for measurement of volume and density of a gas?.","options":["0 °C and 760mm of Mercury.","20 °C and 700mm of Mercury.","20 °C and 760mm of Mercury."],"answer":0,"answerText":"0 °C and 760mm of Mercury.","explanation":"STP also applies to solids and liquids."},{"topic":"3a. Thermodynamics.","sourceNumber":36,"q":"In 'standard conditions' what is the standard for measurement of volume and density of a liquid or solid?.","options":["20 °C and 760mm of Mercury.","0 °C and 760mm of Mercury.","20 °C and 700mm of Mercury."],"answer":1,"answerText":"0 °C and 760mm of Mercury.","explanation":""},{"topic":"3a. Thermodynamics.","sourceNumber":37,"q":"842 Degrees Fahrenheit is equal to.","options":["450 Degrees Celsius.","232.2 Degrees Celsius.","400 Degrees Celsius."],"answer":0,"answerText":"450 Degrees Celsius.","explanation":""},{"topic":"3a. Thermodynamics.","sourceNumber":38,"q":"Which of the following 2 points are equal?.","options":["-32 °C and 0 °F.","40 °C and 40 °F.","-40 °C and -40 °F."],"answer":1,"answerText":"-40 °C and -40 °F.","explanation":""},{"topic":"3a. Thermodynamics.","sourceNumber":39,"q":"What is 100 Degrees Centigrade in Fahrenheit?.","options":["30 Degrees.","148 Degrees.","212 Degrees."],"answer":2,"answerText":"212 Degrees.","explanation":""},{"topic":"3a. Thermodynamics.","sourceNumber":40,"q":"The absolute temperature scale that has the same increments as the Fahrenheit scale is the.","options":["Rankin scale.","Kelvin scale.","Celsius scale."],"answer":0,"answerText":"Rankin scale.","explanation":""},{"topic":"3a. Thermodynamics.","sourceNumber":41,"q":"The absolute temperature scale that has the same increments as the Celsius scale is the.","options":["Rankin scale.","Kelvin scale.","Fahrenheit scale."],"answer":1,"answerText":"Kelvin scale.","explanation":"NIL. 3b. Thermodynamics."},{"topic":"3b. Thermodynamics.","sourceNumber":1,"q":"For a heat pump to internally heat it uses a.","options":["inside evaporator.","inside condenser.","outside condenser."],"answer":1,"answerText":"inside condenser.","explanation":"NIL. http://en.wikipedia.org/wiki/Heat_pump"},{"topic":"3b. Thermodynamics.","sourceNumber":2,"q":"The heat required to change a liquid to a gas is called the heat of.","options":["condensation.","fusion.","vapourisation."],"answer":2,"answerText":"vapourisation.","explanation":"Liquid to gas is vapourisation. Solid to liquid is fusion (another term for melting - like fusion welding)."},{"topic":"3b. Thermodynamics.","sourceNumber":3,"q":"What is the SI units for specific heat capacity?.","options":["Jkg-1k-1.","J/S/C.","J/ kg."],"answer":0,"answerText":"Jkg-1k-1.","explanation":""},{"topic":"3b. Thermodynamics.","sourceNumber":4,"q":"The most common refrigerants are.","options":["water, ammonia, freon.","water, freon, carbon dioxide.","ammonia, freon, methyl bromide."],"answer":0,"answerText":"water, ammonia, freon.","explanation":"All are refrigerants - water is used in cooling towers. Methyl bromide is almost completely phased out due to safety and environmental reasons. Carbon dioxide has been used but no more due to availability of better refrigerants such as ammonia."},{"topic":"3b. Thermodynamics.","sourceNumber":5,"q":"How is heat transferred in a vacuum?.","options":["Convection.","Conduction.","Radiation."],"answer":2,"answerText":"Radiation.","explanation":""},{"topic":"3b. Thermodynamics.","sourceNumber":6,"q":"The specific heat capacity of a gas heated at constant pressure, when compared to the specific heat capacity of a gas heated at constant volume, is.","options":["more.","less.","the same."],"answer":0,"answerText":"more.","explanation":"Cp is slightly higher than Cv. Usually it only applies to gases. For example the Cp for air is 1.4 times more than its Cv."},{"topic":"3b. Thermodynamics.","sourceNumber":7,"q":"Adiabatic compression is when.","options":["no heat is lost or gained.","kinetic energy is gained.","heat is given off to the surroundings."],"answer":0,"answerText":"no heat is lost or gained.","explanation":""},{"topic":"3b. Thermodynamics.","sourceNumber":8,"q":"The heat required to change a solid to a liquid is called the heat of.","options":["vapourisation.","condensation.","fusion."],"answer":2,"answerText":"fusion.","explanation":"Another word for melting is 'fusion' (as in fusion welding - or... 'a fuse')."},{"topic":"3b. Thermodynamics.","sourceNumber":9,"q":"Latent heat is the.","options":["heat required to raise the temperature of a body by 1 °C.","heat required to raise 1kg of matter by 1K.","heat required to change the state of a body."],"answer":2,"answerText":"heat required to change the state of a body.","explanation":"Latent' means 'hidden'. It is the heat energy required to change the state (melt or vapourise). No rise in temperature is pruduced whilst doing so - hence the 'hidden' bit."},{"topic":"3b. Thermodynamics.","sourceNumber":10,"q":"The intensity of radiated heat is.","options":["inversely proportional to the square of the distance from the source of the heat.","not effected by the distance from the source of the heat.","directly proportional to distance from the source of the heat."],"answer":0,"answerText":"inversely proportional to the square of the distance from the source of the heat.","explanation":"Like most such things, intensity of heat, gravity, magnetism etc. - they all reduce with the square of the distance (i.e. double the distance and the intensity is 1/4)."},{"topic":"3b. Thermodynamics.","sourceNumber":11,"q":"As a block of ice is melted (to 4 °C). Its volume.","options":["remains the same.","decreases.","increases."],"answer":1,"answerText":"decreases.","explanation":"Ice expands as it gets colder - which is why water pipes burst if they freeze."},{"topic":"3b. Thermodynamics.","sourceNumber":12,"q":"A good refrigerant has.","options":["high condensing pressure, low evaporating temperature.","high condensing pressure, high evaporating temperature.","low condensing pressure, low vaporating temperature."],"answer":2,"answerText":"low condensing pressure, low vaporating temperature.","explanation":"The refrigerant must evaporate at lower temperature than the 'cold space' and must condense at a relatively high temperature, with a low compression level."},{"topic":"3b. Thermodynamics.","sourceNumber":13,"q":"In a heat pump.","options":["In a heat pump.","the condenser loses heat.","flow across the condenser is always in one direction."],"answer":1,"answerText":"the condenser loses heat.","explanation":"Heat pumps can be used to cool as well as heat. Refrigerant flow changes direction respectively, but the condensor always rejects the heat."},{"topic":"3b. Thermodynamics.","sourceNumber":14,"q":"Charles' Law states that.","options":["volume varies inversely with temperature.","volume varies directly with temperature.","volume equals pressure * temperature."],"answer":1,"answerText":"volume varies directly with temperature.","explanation":"NIL. http://en.wikipedia.org/wiki/Charles_law"},{"topic":"3b. Thermodynamics.","sourceNumber":15,"q":"Boyle's law states that.","options":["pressure equals temperature divided by volume.","pressure varies directly with volume.","pressure varies inversely with volume."],"answer":2,"answerText":"pressure varies inversely with volume.","explanation":"Pressure rises, volume decreases."},{"topic":"3b. Thermodynamics.","sourceNumber":16,"q":"Convection does not occur in.","options":["liquids.","liquids.","solids."],"answer":2,"answerText":"solids.","explanation":"The medium must 'flow' for conduction to take place."},{"topic":"3b. Thermodynamics.","sourceNumber":17,"q":"A process where volume does not change is.","options":["isochoric.","isobaric.","isothermic."],"answer":0,"answerText":"isochoric.","explanation":""},{"topic":"3b. Thermodynamics.","sourceNumber":18,"q":"A process where heat is not transferred to or from a gas is.","options":["adiabatic.","isochoric.","isobaric."],"answer":0,"answerText":"adiabatic.","explanation":""},{"topic":"3b. Thermodynamics.","sourceNumber":19,"q":"A process where pressure does not change is known as.","options":["isochoric.","isothermic.","isobaric."],"answer":2,"answerText":"isobaric.","explanation":"Iso' means equal. 'bar' is pressure."},{"topic":"3b. Thermodynamics.","sourceNumber":20,"q":"When a liquid is heated, it expands.","options":["more than a solid.","less than a solid.","more than a gas."],"answer":0,"answerText":"more than a solid.","explanation":"Generally speaking, liquids have a greater coefficient of thermal expansion than solids."},{"topic":"3b. Thermodynamics.","sourceNumber":21,"q":"If pressure on a liquid increases, whilst temperature is held constant, the volume will.","options":["decrease.","remain constant.","increase."],"answer":1,"answerText":"remain constant.","explanation":"Liquids are incompressible."},{"topic":"3b. Thermodynamics.","sourceNumber":22,"q":"A process where temperature remains the same is known as.","options":["isobaric.","isochoric.","isothermic."],"answer":2,"answerText":"isothermic.","explanation":"Iso' means equal. 'Thermal' is temperature."},{"topic":"3b. Thermodynamics.","sourceNumber":23,"q":"What is descriptive of Boyle's Law? (P=Pressure, V=Volume, T=Temperature).","options":["P is proportional to 1/T.","P is proportional to 1/V.","P is proportional to T."],"answer":1,"answerText":"P is proportional to 1/V.","explanation":"Pressure (P) is inversely proportional to volume (V)."},{"topic":"3b. Thermodynamics.","sourceNumber":24,"q":"A compressor increases.","options":["kinetic energy.","potential energy.","moving energy."],"answer":1,"answerText":"potential energy.","explanation":"Compressed air is a form of 'potential energy'."},{"topic":"3b. Thermodynamics.","sourceNumber":25,"q":"P1 * V1 / T1 = P2 * V2 / T2 is (P=Pressure, V=Volume, T=Temperature).","options":["Ideal gas law.","Charles' law.","Boyle's law."],"answer":0,"answerText":"Ideal gas law.","explanation":""},{"topic":"3b. Thermodynamics.","sourceNumber":26,"q":"V1 / T1 = V2 / T2 at a constant pressure is (P=Pressure, V=Volume, T=Temperature).","options":["ideal gas law.","Boyle's law.","Charles' law."],"answer":2,"answerText":"Charles' law.","explanation":""},{"topic":"3b. Thermodynamics.","sourceNumber":27,"q":"P1 * V1 = P2 * V2 at a constant temperature is (P=Pressure, V=Volume, T=Temperature).","options":["Boyle's law.","ideal gas law.","Charles' law."],"answer":0,"answerText":"Boyle's law.","explanation":""},{"topic":"3b. Thermodynamics.","sourceNumber":28,"q":"The atmosphere's temperature changes at a rate of -1.98 °C per 1000 ft up to 36,000 ft where it remains constant at.","options":["-56 °F.","-52 °C.","-56 °C."],"answer":2,"answerText":"-56 °C.","explanation":"The troposphere is a constant -56 degrees C."},{"topic":"3b. Thermodynamics.","sourceNumber":29,"q":"A process where heat is given off to its surroundings is called.","options":["isothermal.","adiabatic.","isobaric."],"answer":0,"answerText":"isothermal.","explanation":"Adiabatic' is a process where NO heat is given off to its surroundings. Isobaric is constant pressure. Isothermal, to keep constant temperature must give off heat as it is compressed."},{"topic":"3b. Thermodynamics.","sourceNumber":30,"q":"A body which is allowed to expand when heated, expands past the pressure imposed on it and.","options":["a force is produced.","nothing will happen.","work is done."],"answer":2,"answerText":"work is done.","explanation":"Work is done when it exerts a force and moves (work = force x distance). Yes, a force is produced but this is not the whole story."},{"topic":"3b. Thermodynamics.","sourceNumber":31,"q":"The quantity of heat developed by burning 1 kg of fuel is known as.","options":["radiant heat.","latent heat.","heat of combustion."],"answer":2,"answerText":"heat of combustion.","explanation":"The energy content of fuel is known as 'heat of combustion'."},{"topic":"3b. Thermodynamics.","sourceNumber":32,"q":"The transfer of heat through radiation is achieved by the application of radioactive isotopes.","options":["the application of radioactive isotopes.","warming up the intervening medium.","not warming up the intervening medium."],"answer":1,"answerText":"warming up the intervening medium.","explanation":""},{"topic":"3b. Thermodynamics.","sourceNumber":33,"q":"The dew point is.","options":["the point when air is cooled at which the moisture just starts to condense.","the point at which air can be heated.","the point when air is cooled at which the moisture does not condense."],"answer":0,"answerText":"the point when air is cooled at which the moisture just starts to condense.","explanation":"Check the definition of dew point."},{"topic":"3b. Thermodynamics.","sourceNumber":34,"q":"What are common refrigerant agents?.","options":["formaldehyde, ammonia, carbon dioxide.","water, freon, ammonia.","Dry ice, methyl bromide, water."],"answer":1,"answerText":"water, freon, ammonia.","explanation":"Water is used in cooling towers (and when you sweat). Freon and ammonia are commonly used in fridges and air-con systems."},{"topic":"3b. Thermodynamics.","sourceNumber":35,"q":"During a process of gas heating, no heat is absorbed or given out. It is.","options":["adiabatic.","isochoric.","isothermal."],"answer":0,"answerText":"adiabatic.","explanation":"No heat absorbed or given out is 'adiabatic'."},{"topic":"3b. Thermodynamics.","sourceNumber":36,"q":"During a pressurising process, all heat is given away. It is.","options":["adiabatic.","isochoric.","isothermal."],"answer":2,"answerText":"isothermal.","explanation":"All heat given away keeps the process at constant temperature - thus 'isothermal'."},{"topic":"3b. Thermodynamics.","sourceNumber":37,"q":"A material capable of going direct from solid to gas is a.","options":["substrate.","substance.","sublimate."],"answer":2,"answerText":"sublimate.","explanation":"A sublimate can go directly from solid to gas."},{"topic":"3b. Thermodynamics.","sourceNumber":38,"q":"The composition of the atmosphere is approximately.","options":["1/5 oxygen and 4/5 nitrogen.","4/5 oxygen and 1/5 nitrogen.","2/5 oxygen and 3/5 nitrogen."],"answer":0,"answerText":"1/5 oxygen and 4/5 nitrogen.","explanation":"Air is 78% (approx. 4/5) nitrogen and 21% (approx 1/5) oxygen."},{"topic":"3b. Thermodynamics.","sourceNumber":39,"q":"What is meant by adiabatic?.","options":["All heat crosses the boundary.","No heat crosses the boundary.","Some heat crosses the boundary."],"answer":1,"answerText":"No heat crosses the boundary.","explanation":"No heat is lost or gained in an adiabatic process."},{"topic":"3b. Thermodynamics.","sourceNumber":40,"q":"If a gas is heated and its temperature is raised by 1K. What happens to its volume?.","options":["Decreases by 1/273.","Increases by 1/273.","Remains the same."],"answer":1,"answerText":"Increases by 1/273.","explanation":"Charles's Law. Also how the absolute zero (-273 °C is calculated)."},{"topic":"3b. Thermodynamics.","sourceNumber":41,"q":"If a block of ice melts in a glass of water, the level of water in the glass will.","options":["fall.","rise.","remain the same."],"answer":2,"answerText":"remain the same.","explanation":""},{"topic":"3b. Thermodynamics.","sourceNumber":42,"q":"If heat is constant, and if pressure increases on a liquid what will the volume do?.","options":["Increase.","Remains constant.","Decrease."],"answer":1,"answerText":"Remains constant.","explanation":"Liquids are considered incompressible, therefore their volume remains constant."},{"topic":"3b. Thermodynamics.","sourceNumber":43,"q":"Radiant heat of a body, heated from a radiant source is.","options":["inversely proportional to the square of the distance.","proportional to distance.","inversely proportional."],"answer":0,"answerText":"inversely proportional to the square of the distance.","explanation":"The wording of this question is terrible, but it is probably referring to radiant heat being inversely proportional to the square of the distance from the source of the."},{"topic":"3b. Thermodynamics.","sourceNumber":44,"q":"Combined gas law relates volume, pressure and.","options":["temperature.","density.","velocity."],"answer":0,"answerText":"temperature.","explanation":"P1V1/T1 = P2V2/T2 Combined (or ideal) gas law."},{"topic":"3b. Thermodynamics.","sourceNumber":45,"q":"The heat given off by burning a 1kg block of wood is.","options":["transmissive heat.","radiant heat.","latent heat."],"answer":1,"answerText":"radiant heat.","explanation":"The embers of burning wood produce radiant heat."},{"topic":"3b. Thermodynamics.","sourceNumber":46,"q":"H20 in what form holds most energy?.","options":["Steam.","Ice.","Water."],"answer":0,"answerText":"Steam.","explanation":"Water in the form of steam has the most energy."},{"topic":"3b. Thermodynamics.","sourceNumber":47,"q":"A block of metal is melted. It will.","options":["remain the same volume.","decrease in volume.","increase in volume."],"answer":2,"answerText":"increase in volume.","explanation":""},{"topic":"3b. Thermodynamics.","sourceNumber":48,"q":"The energy that ice at 0 °C must gain so that it turns to water at 0 °C is called.","options":["the latent heat of vaporisation.","sensible energy.","the latent heat of fusion."],"answer":2,"answerText":"the latent heat of fusion.","explanation":"Fusion means 'to melt'."},{"topic":"3b. Thermodynamics.","sourceNumber":49,"q":"Ideal gas goes through an isothermal process. It is in accordance with which law?.","options":["Gay Lussac's.","Boyle's.","Charles's."],"answer":1,"answerText":"Boyle's.","explanation":"Boyle's Law (P/V = constant) assumes constant temperature (isothermal)."},{"topic":"3b. Thermodynamics.","sourceNumber":50,"q":"The Steam Point of water is.","options":["0 Kelvin.","373 Kelvin.","273 Kelvin."],"answer":1,"answerText":"373 Kelvin.","explanation":"K = C + 273."},{"topic":"3b. Thermodynamics.","sourceNumber":51,"q":"A 200 cm titanium bar increases in length by 2 cm when its temperature rises by 100 °C. Its linear expansivity is.","options":["0.0101 per °C.","0.01 per °C.","0.0001 per °C."],"answer":2,"answerText":"0.0001 per °C.","explanation":"Expansion = L x alpha x temp.change So alpha = Expansion/(L x temp.change) = 2/(200 * 100) = 0.0001 per °C."},{"topic":"3b. Thermodynamics.","sourceNumber":52,"q":"Heat transmission by convection is confined to.","options":["liquids and gases.","gases and solids.","solids and liquids."],"answer":0,"answerText":"liquids and gases.","explanation":"In convection, the material must 'flow' and carry the heat with it."},{"topic":"3b. Thermodynamics.","sourceNumber":53,"q":"Which contains the least amount of heat energy?.","options":["Both 1 kg of ice at 0 °C and 1 kg of water at 0 °C have the same amount of heat energy.","1 kg of water at 0 °C.","1 kg of ice at 0 °C."],"answer":0,"answerText":"Both 1 kg of ice at 0 °C and 1 kg of water at 0 °C have the same amount of heat energy.","explanation":"The temperature only is a measure of the heat energy, not the state."},{"topic":"3b. Thermodynamics.","sourceNumber":54,"q":"Which weighs the most?.","options":["1 kg of ice at 0 °C.","Both 1 kg of ice at 0 °C and 1 kg of water at 0 °C have the same weight.","1 kg of water at 0 °C."],"answer":1,"answerText":"Both 1 kg of ice at 0 °C and 1 kg of water at 0 °C have the same weight.","explanation":""},{"topic":"3b. Thermodynamics.","sourceNumber":55,"q":"Which has the greatest density?.","options":["1 kg of ice at 0 °C.","1 kg of water at 0 °C.","Both 1 kg of ice at 0 °C and 1 kg of ice at 0 °C have the same density."],"answer":2,"answerText":"Both 1 kg of ice at 0 °C and 1 kg of ice at 0 °C have the same density.","explanation":""},{"topic":"3b. Thermodynamics.","sourceNumber":56,"q":"Which has the greatest volume?.","options":["1 kg of water at 0 °C.","1 kg of ice at 0 °C.","Both 1 kg of ice at 0 °C and 1 kg of ice at 0 °C have the same volume."],"answer":2,"answerText":"Both 1 kg of ice at 0 °C and 1 kg of ice at 0 °C have the same volume.","explanation":""},{"topic":"3b. Thermodynamics.","sourceNumber":57,"q":"The temperature at which water will exist as a solid, liquid and gas, all at the same time, is called.","options":["the triple point and is approximately 0 °C.","the tri-state point and is approximately at 0 °C.","the tri-state point and is approximately 98 °C."],"answer":0,"answerText":"the triple point and is approximately 0 °C.","explanation":""},{"topic":"3b. Thermodynamics.","sourceNumber":58,"q":"Material A and material B are both removed from the same oven at the same time, after being in the same amount of time. Material A is a higher temperature than material B. This is because.","options":["material B has a higher specific heat capacity.","material A must have had a higher temperature before it was put in the oven.","material A has a higher specific heat capacity."],"answer":2,"answerText":"material A has a higher specific heat capacity.","explanation":"NIL. 4. Optics (Light)."},{"topic":"4. Optics (Light).","sourceNumber":1,"q":"What is the thickness of a single mode fibre optic?.","options":["200 micrometres.","5 micrometres.","50 micrometres."],"answer":1,"answerText":"5 micrometres.","explanation":"Introduction to Fiber Optics 3rd Edition John Crisp and Barry Elliot Page 67."},{"topic":"4. Optics (Light).","sourceNumber":2,"q":"Divergent light rays give rise to.","options":["a real image.","a virtual image.","chromatic aberrations."],"answer":1,"answerText":"a virtual image.","explanation":""},{"topic":"4. Optics (Light).","sourceNumber":3,"q":"In fibreoptics the type of cable is chosen by.","options":["matching the diameter of the cable to the wavelength.","distance required to travel.","the strength of signal needed."],"answer":1,"answerText":"distance required to travel.","explanation":"Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":4,"q":"A material with a gradually varying refractive index is said to have a.","options":["graded index.","step index.","single index."],"answer":0,"answerText":"graded index.","explanation":"Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":5,"q":"Fibre optic cables are capable of transmitting light at.","options":["1.99 * 108 m/s.","3 * 108 m/s.","0.99 * 108 m/s."],"answer":0,"answerText":"1.99 * 108 m/s.","explanation":"Speed of light in a vacuum is 3 * 10 to the power 8. But the refractiv index of glass is about 1.5. So divide 3 * 10 to the power 8 by 1.5...Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":6,"q":"Step index fibres suffer from.","options":["dispersion.","scatter.","attenuation."],"answer":0,"answerText":"dispersion.","explanation":"Dispersion also limits the bandwidth in step index fibres. Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":7,"q":"Attenuated pulses have their sizes and shape restored by.","options":["regenerators.","impedance matching transformers.","opto-isolators."],"answer":0,"answerText":"regenerators.","explanation":"Regenerators are placed in the fibre optic line (usually not less than 1 km spacings) to boost the signal (like a relay system). Thus reducing attenuation at the recieving end. Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":8,"q":"Attenuation in fibre optic cables is most often caused by.","options":["backscattering and microbends.","microbends and scattering.","absorption and scattering."],"answer":2,"answerText":"absorption and scattering.","explanation":"Although all three (microbends, scattering and absorbtion) cause attenuation in fibre optics, microbends are the most easy to manufacture out of the cable. Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":9,"q":"For a concave lens the image is.","options":["virtual.","real.","a chromatic orb."],"answer":0,"answerText":"virtual.","explanation":""},{"topic":"4. Optics (Light).","sourceNumber":10,"q":"In a fibre optic flying control system.","options":["the sensor and the transmitter require electrical power.","the transmitter requires power.","the sensor requires electrical power."],"answer":0,"answerText":"the sensor and the transmitter require electrical power.","explanation":"The transmitter is an LED or laser (both need power) and the receiver is a photodiode, which needs electrical power. Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":11,"q":"Photons in a semiconductor are stimulated to produce excess photons to be emitted. This is a.","options":["photodiode.","laser diode.","LED."],"answer":1,"answerText":"laser diode.","explanation":"LASER - Light Amplification by the Stimulated Emition of Radiation. Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":12,"q":"In a fibre optic flying control system, which of the following are used?.","options":["Single mode fibre.","Multi mode fibre.","Dual mode fibre."],"answer":1,"answerText":"Multi mode fibre.","explanation":"Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":13,"q":"A fibre optic cable is attenuated at 29 dB/metre. This is referring to.","options":["allowable loss.","the figure allowed for when calculating power gain.","the maximum cable run allowed in the system."],"answer":1,"answerText":"the figure allowed for when calculating power gain.","explanation":"Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":14,"q":"The fibre optic receiver is a.","options":["laser diode.","photodiode.","light emitting diode."],"answer":1,"answerText":"photodiode.","explanation":"Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":15,"q":"Regenerators are used in fibre optic systems to reduce.","options":["dispersion.","random emission.","attenuation."],"answer":2,"answerText":"attenuation.","explanation":"Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":16,"q":"When light rays enter a medium with a different refractive index they.","options":["change direction.","reflect.","change speed."],"answer":2,"answerText":"change speed.","explanation":"They will only change direction if they hit the surface at an angle other than 0 degrees (to the normal). It will always change speed however."},{"topic":"4. Optics (Light).","sourceNumber":17,"q":"A converging lens can focus light rays because.","options":["the incoming rays are already converging.","it is spherical.","the light rays travel more slowly at the centre."],"answer":1,"answerText":"it is spherical.","explanation":"A converging lens is a part of a sphere, so light rays hit it at different angles depending upon its distance from the principle axis."},{"topic":"4. Optics (Light).","sourceNumber":18,"q":"If a ray of light enters a fibre optic cable with a refractive index of 1.5, what is the speed of the ray in the cable?.","options":["300,000 kilometres per second.","400,000 kilometres per second.","200,000 kilometres per second."],"answer":2,"answerText":"200,000 kilometres per second.","explanation":"vacuum / speed of light in medium. 1.5 = 300,000 / C, C = 200,000 km/s. Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":19,"q":"vacuum / speed of light in medium. 1.5 = 300,000 / C, C = 200,000 km/s. Introduction to Fiber Optics by John Crisp.","options":["a constant refractive index across its cross sectional area.","a variable refractive index across its cross sectional area.","a sudden change in refractive index."],"answer":1,"answerText":"a variable refractive index across its cross sectional area.","explanation":"Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":20,"q":"A mirror.","options":["refracts all light.","reflects all light.","absorbs a percentage of light."],"answer":2,"answerText":"absorbs a percentage of light.","explanation":""},{"topic":"4. Optics (Light).","sourceNumber":21,"q":"The width of a multimode fibre optic cable (including the cladding) is.","options":["1 µm.","100 µm.","10 µm."],"answer":1,"answerText":"100 µm.","explanation":"This must be referring to the 'overall' diameter - i.e that of the cladding, since the core is 50 or 62.5 micrometers (microns). Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":22,"q":"A varying refractive index optical fibre is a.","options":["single index.","graded index.","step index."],"answer":1,"answerText":"graded index.","explanation":"Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":23,"q":"Refractive index is.","options":["the speed of light in the medium divided by the speed of light in air.","the speed of light in air divided by the speed of light in the medium.","the speed of light in air multiplied by the speed of light in the medium."],"answer":2,"answerText":"the speed of light in air multiplied by the speed of light in the medium.","explanation":"Introduction to Fiber Optics by John Crisp page 11."},{"topic":"4. Optics (Light).","sourceNumber":24,"q":"What is the speed of light in km/s?.","options":["3000.","3 * 108.","300000."],"answer":2,"answerText":"300000.","explanation":"300,000,000 m/s = 300,000,000/1000 km/s = 300,000 km/s. Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":25,"q":"The focal point of a mirror is.","options":["1/2 the radius.","the radius.","2 * the radius."],"answer":0,"answerText":"1/2 the radius.","explanation":""},{"topic":"4. Optics (Light).","sourceNumber":26,"q":"What is the speed of light in air at 0 °C.","options":["331 m/s.","300 m/µs.","331 mm/s."],"answer":1,"answerText":"300 m/µs.","explanation":"Standard figure is 300,000,000 m/s. Convert that to m/microsecond and you must divide by 1,000,000. Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":27,"q":"How far will light travel in one year?.","options":["9.46 * 1015 m.","1.5 * 1011 m.","3 * 1015 m."],"answer":0,"answerText":"9.46 * 1015 m.","explanation":"60 * 60 * 24 * 365 * 300000000 = 9.46.... What a calculation to do without your calculator - estimate as best you can."},{"topic":"4. Optics (Light).","sourceNumber":28,"q":"When different signals are transmitted down a fibre optic core, are they distinguished by a.","options":["active filter.","passive filter.","star coupler."],"answer":1,"answerText":"passive filter.","explanation":"A 'passive filter' simply sorts out and/or blocks certain wavelengths. An 'active filter' will catch certain wavelengths and convert them to other wavelength. Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":29,"q":"On an Optical Time Domain Reflectometer (OTDR), the amount of attenuation in the cable is.","options":["read from the cathode ray display.","derived from a graph.","dialed into OTDR."],"answer":0,"answerText":"read from the cathode ray display.","explanation":"See 'Introduction to Fiber Optics' pg. 157. Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":30,"q":"In a flat surfaced mirror, the angle of reflection is.","options":["equal to the angle of incidence.","less than the angle of incidence.","more than the angle of incidence."],"answer":0,"answerText":"equal to the angle of incidence.","explanation":"The angle of incidence is the angle the light makes with the 'normal' line. The angle of reflection is equal on the other side of the 'normal' line."},{"topic":"4. Optics (Light).","sourceNumber":31,"q":"In a multimode fibre optic cable, the.","options":["diameter is greater than the wavelength.","diameter is less than the wavelength.","diameter is equal to the wavelength."],"answer":0,"answerText":"diameter is greater than the wavelength.","explanation":"Multimode fibres are bigger than single mode fibres. Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":32,"q":"A converging lens converges light rays because.","options":["it is not a sphere.","the light source is already converging.","the light waves are refracted less in the centre of the lens than they are at the extremities."],"answer":2,"answerText":"the light waves are refracted less in the centre of the lens than they are at the extremities.","explanation":""},{"topic":"4. Optics (Light).","sourceNumber":33,"q":"In fibre optics. The fibre cable has a refractive index of 1.5, what is its speed?.","options":["300 meters/microsecond.","400 meters/microsecond.","200 meters/microsecond."],"answer":2,"answerText":"200 meters/microsecond.","explanation":"n = speed of light in vacuum / speed of light in substance. 1.5 = 300m per microsecond / speed of light in fibre. Transpose.. Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":34,"q":"A material, which has a varying refractive index is a.","options":["step index.","single index.","double index."],"answer":0,"answerText":"step index.","explanation":"A varying refractive index is either 'step index' or 'graded index'. Step index is the only answer available. Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":35,"q":"A ray of light that travels through the centre of curvature of a concave mirror before being reflected, how is it reflected?.","options":["Through the focal point.","Neither of the above.","Through the centre of curvature."],"answer":0,"answerText":"Through the focal point.","explanation":"The focal point and the centre of curvature of the concave mirror lie on the same center line. A ray of light travelling along that centre line will be reflected right back along the same path - through the focal point."},{"topic":"4. Optics (Light).","sourceNumber":36,"q":"What will the image produced through a divergent lens be?.","options":["Negative.","Real.","Virtual."],"answer":2,"answerText":"Virtual.","explanation":"The image produced by a divergent (concave) lens is a 'VIRTUAL' image. i.e you could not take a photograph of it."},{"topic":"4. Optics (Light).","sourceNumber":37,"q":"When a beam of light passes from one medium to another with a different refractive index, what will happen to the beam of light?.","options":["Total internal reflection.","Change speed.","Total internal refraction."],"answer":1,"answerText":"Change speed.","explanation":"A beam of light passes from one medium to another - its speed will change. This is the only statement of certainty, since no information is given about the angle of incidence."},{"topic":"4. Optics (Light).","sourceNumber":38,"q":"A fibre optic cable has different refractive indexes across its core diameter, it is a.","options":["single mode fibre.","graded index fibre.","step index fibre."],"answer":1,"answerText":"graded index fibre.","explanation":"A fibre optic with a different refractive index across its core diameter is a 'graded index'. Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":39,"q":"Incident light travelling from air to water, the light is.","options":["bent towards the normal.","not bent.","bent away from the normal."],"answer":0,"answerText":"bent towards the normal.","explanation":"Light travelling from air to water, the waves are bent (or angled) less when measured to the normal."},{"topic":"4. Optics (Light).","sourceNumber":40,"q":"If a light is beamed at a flat mirror, what is the angle it reflects at?.","options":["Reflective index.","Angle of incidence.","Reactive angle."],"answer":1,"answerText":"Angle of incidence.","explanation":"The angle the light hits a mirror (to the normal) is the Angle of Incidence. The angle it bounces off (to the normal) is the Angle of Reflection. The two angles are always equal."},{"topic":"4. Optics (Light).","sourceNumber":41,"q":"In a graded index multimode fibre is the refractive index.","options":["is high.","varies high and low.","is low."],"answer":1,"answerText":"varies high and low.","explanation":"In a graded index fibre optic cable, the refractive index is low at the edge, high in the centre and then low at the other edge. Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":42,"q":"The fibre optic receiver is a.","options":["photodiode.","laser diode.","light emitting diode."],"answer":0,"answerText":"photodiode.","explanation":"The fibre optic receiver is a photo diode. Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":43,"q":"The usable bandwidth of a fibre is determined by.","options":["the wavelength of the light.","the angle of total internal reflection.","the intermodal dispersion."],"answer":2,"answerText":"the intermodal dispersion.","explanation":"Bandwidth is the range of frequencies that can be transmitted. Since different frequencies travel at different speed (in glass) they will arrive at the other end at different times. This is the cause of intermodal dispersion. Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":44,"q":"If, with a concave mirror the image is placed beyond the centre of curvature, the image produced will be.","options":["virtual, erect and larger.","real, inverted and smaller.","real, erect and larger."],"answer":1,"answerText":"real, inverted and smaller.","explanation":""},{"topic":"4. Optics (Light).","sourceNumber":45,"q":"The power of a lens is calculated from the.","options":["reciprocal of the focal length.","product of the focal length and its distance from the pole.","focal length squared."],"answer":0,"answerText":"reciprocal of the focal length.","explanation":"focal length squared."},{"topic":"4. Optics (Light).","sourceNumber":46,"q":"Single mode optical fibre cable will.","options":["have several light rays to pass.","have diameter matched to wavelength of light passed.","cause distortion to the light wave at the output end which is dependent upon the length of the cable."],"answer":1,"answerText":"have diameter matched to wavelength of light passed.","explanation":"Introduction to Fiber Optics John Crisp page 64."},{"topic":"4. Optics (Light).","sourceNumber":47,"q":"When an emergent light wave enters a divergent lens.","options":["it will focus beyond the lens.","it will focus behind the lens.","it is s spherical."],"answer":1,"answerText":"it will focus behind the lens.","explanation":"A divergent lens (also known as concave lens) focuses the image on the same side of the lens as the object. It is therefore a virtual image."},{"topic":"4. Optics (Light).","sourceNumber":48,"q":"In a concave mirror, light rays parallel to mirror axis will be reflected.","options":["through the focal point.","back to the centre of curvature.","parallel to mirror axis."],"answer":0,"answerText":"through the focal point.","explanation":"All the light rays focus at the focal point."},{"topic":"4. Optics (Light).","sourceNumber":49,"q":"In a concave mirror, a light ray passing through the focal point will be reflected.","options":["through the focal point.","on the centre line of the mirror.","parallel to the axis."],"answer":2,"answerText":"parallel to the axis.","explanation":"All rays which pass through the focal point, reflect from the mirror then travel parallel to the axis."},{"topic":"4. Optics (Light).","sourceNumber":50,"q":"A passive sensor.","options":["does not require power.","requires power for the sensor.","requires power for the transmitter."],"answer":0,"answerText":"does not require power.","explanation":"Passive sensors do not require power. Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":51,"q":"Refractive index is.","options":["lower for 4ºC water than 0ºC ice.","higher for diamond than acrylic.","highest for water."],"answer":1,"answerText":"higher for diamond than acrylic.","explanation":"Diamond has the highest refractive index. Note: 4 °C. water is more dense than ice so has greater refractive index."},{"topic":"4. Optics (Light).","sourceNumber":52,"q":"For optical fibres, the refractive index of the cladding compared to that of the core.","options":["can be either bigger or smaller depending on specification.","is always smaller.","is always larger."],"answer":1,"answerText":"is always smaller.","explanation":"Cladding always has a lower refractive index. Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":53,"q":"The ability for a fibreoptic cable to carry waves is dependent on.","options":["material, absorption and speed of light.","internal reflection.","material, diameter and absorption."],"answer":1,"answerText":"internal reflection.","explanation":"Fiber optics carry light by Total Internal Reflection. Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":54,"q":"In spherical aberrations.","options":["incident rays further from the axis intersect slightly closer to the lens to produce a distorted picture.","incident rays further from the axis intersect slightly further away from the lens to produce a distorted picture.","the bending of light through lens intersect at the same point (achromatic lens)."],"answer":0,"answerText":"incident rays further from the axis intersect slightly closer to the lens to produce a distorted picture.","explanation":""},{"topic":"4. Optics (Light).","sourceNumber":55,"q":"In a fibre optic flying control system.","options":["the sensor and transmitter require electrical power.","the sensor inputs to the transmitter which needs electrical power.","the sensor needs electrical power."],"answer":0,"answerText":"the sensor and transmitter require electrical power.","explanation":"The sensor is a photodiode or a PIN diode (needs power) and the transmitter is an LED or laser (needs power). Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":56,"q":"In fibreoptics, the type of cable is chosen by.","options":["the strength of signal needed.","matching the diameter of the cable with the wavelength.","distance required to travel."],"answer":2,"answerText":"distance required to travel.","explanation":"Type of cable (not the diameter) - single mode, multimode or graded index etc. is chosen for its attenuation and hence length. Introduction to Fiber Optics by John."},{"topic":"4. Optics (Light).","sourceNumber":57,"q":"When refraction takes place.","options":["the frequency remains constant.","the speed of the wave remains constant.","the wavelength remains constant."],"answer":0,"answerText":"the frequency remains constant.","explanation":"Frequency remains constant."},{"topic":"4. Optics (Light).","sourceNumber":58,"q":"When light meets a Glass / Air boundary at an angle of incidence less than the critical angle.","options":["Total Internal Reflection takes place.","no light is reflected.","both reflection and refraction takes place."],"answer":2,"answerText":"both reflection and refraction takes place.","explanation":"Even at angles less than the critical, a small portion of the light in reflected Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":59,"q":"An object placed more than twice the focal length beyond a converging lens will form an image that is.","options":["inverted, larger and virtual.","inverted, smaller and real.","erect, smaller and real."],"answer":1,"answerText":"inverted, smaller and real.","explanation":""},{"topic":"4. Optics (Light).","sourceNumber":60,"q":"A parabolic mirror may be used to prevent.","options":["lateral inversion.","spherical aberration.","formation of a penumbra."],"answer":1,"answerText":"spherical aberration.","explanation":""},{"topic":"4. Optics (Light).","sourceNumber":61,"q":"The refractive index for air is approximately.","options":["1.","10.","0."],"answer":0,"answerText":"1.","explanation":"Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":62,"q":"In optical fibres the total internal reflection of light only occurs at angles.","options":["less than the critical angle.","equal to the critical angle.","greater than the critical angle."],"answer":2,"answerText":"greater than the critical angle.","explanation":"Remember that the critical angle is measured from the normal (or perpendicular) to the surface. Introduction to Fiber Optics by John Crisp page 15."},{"topic":"4. Optics (Light).","sourceNumber":63,"q":"In a concave mirror, if an object is placed between the focal point and the pole, the image will be.","options":["real, erect and diminished.","virtual and on the opposite side.","real, inverted and larger."],"answer":1,"answerText":"virtual and on the opposite side.","explanation":""},{"topic":"4. Optics (Light).","sourceNumber":64,"q":"The purpose of a patch cord used with an OTDR is.","options":["to compensate for any contraction of the Fiber optic cable during test.","to overcome the dead zone problem caused by reflection at OTDR launch connector.","to attenuate OTDR output power which could cause damage to the cable under test."],"answer":1,"answerText":"to overcome the dead zone problem caused by reflection at OTDR launch connector.","explanation":"Introduction to Fiber Optics John Crisp Page 156."},{"topic":"4. Optics (Light).","sourceNumber":65,"q":"The power of a lens is measured in.","options":["Lumens per Watt.","Watts.","Diopters."],"answer":2,"answerText":"Diopters.","explanation":""},{"topic":"4. Optics (Light).","sourceNumber":66,"q":"For a concave lens, the image is.","options":["real.","virtual.","a chromatic orb."],"answer":1,"answerText":"virtual.","explanation":""},{"topic":"4. Optics (Light).","sourceNumber":67,"q":"Lasers use which source of light?.","options":["Scattered.","Refraction.","Coherent."],"answer":2,"answerText":"Coherent.","explanation":"Introduction to Fiber Optics by John Crisp."},{"topic":"4. Optics (Light).","sourceNumber":68,"q":"Illumination of one lumen per metre squared is one.","options":["luxor.","lux.","candle."],"answer":1,"answerText":"lux.","explanation":""},{"topic":"4. Optics (Light).","sourceNumber":69,"q":"The amount of light emitted by a lamp can be measured in.","options":["candle's.","luxors.","lumens."],"answer":2,"answerText":"lumens.","explanation":""},{"topic":"4. Optics (Light).","sourceNumber":70,"q":"The light gathering power of a lens is indicated by its.","options":["material.","thickness of the lens.","focal ratio."],"answer":2,"answerText":"focal ratio.","explanation":""},{"topic":"4. Optics (Light).","sourceNumber":71,"q":"In order for a converging lens to form a real image, the object distance must be more than.","options":["focal length.","5 times the thickness of the lens.","1 inch."],"answer":0,"answerText":"focal length.","explanation":""},{"topic":"4. Optics (Light).","sourceNumber":72,"q":"A ______ lens is thicker in the middle than at the edges. It is.","options":["converging.","concave.","upsharp."],"answer":0,"answerText":"converging.","explanation":"NIL. http://www.phys.hawaii.edu/~teb/optics/java/clens/"},{"topic":"4. Optics (Light).","sourceNumber":73,"q":"When is the only time a concave mirror forms a virtual image?.","options":["When the object is at the focal point.","When the object is inside the focal point.","When the object is placed at the centre of curvature."],"answer":1,"answerText":"When the object is inside the focal point.","explanation":"NIL. http://www.glenbrook.k12.il.us/gbssci/phys/class/refln/u13l3e.html"},{"topic":"4. Optics (Light).","sourceNumber":74,"q":"A convex mirror forms a virtual image when.","options":["the object is at the centre of curvature.","the object is inside the focus.","always."],"answer":2,"answerText":"always.","explanation":""},{"topic":"4. Optics (Light).","sourceNumber":75,"q":"A Concave mirror is used in.","options":["a rear view mirror.","a periscope.","headlights."],"answer":2,"answerText":"headlights.","explanation":"NIL. 5. Wave Motion and Sound."},{"topic":"5. Wave Motion and Sound.","sourceNumber":1,"q":"When the movement of an object rotating around a radius at a constant speed is projected onto a plane, the projected image follows what path?.","options":["Sinusoidal.","Lateral.","Longitudinal."],"answer":0,"answerText":"Sinusoidal.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":2,"q":"The speed of sound in air at 0 °C is approximately.","options":["331 m/s.","3 * 108 m/s.","181 m/s."],"answer":0,"answerText":"331 m/s.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":3,"q":"If a wave traveling to a point meets a wave traveling from that point, of equal frequency.","options":["the two waves cancel each other out.","they will have no effect on each other.","a standing wave is formed."],"answer":2,"answerText":"a standing wave is formed.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":4,"q":"Quality of sound depends upon.","options":["pure sound waves being produced by the source.","frequency and harmonics of the waves being produced.","quality of the receiver."],"answer":1,"answerText":"frequency and harmonics of the waves being produced.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":5,"q":"Particles vibrating in air.","options":["tend to give off heat.","tend to give off light.","produce waves."],"answer":2,"answerText":"produce waves.","explanation":"Particles vibrating in air produce sound."},{"topic":"5. Wave Motion and Sound.","sourceNumber":6,"q":"The fundamental frequency is the.","options":["3rd harmonic.","1st harmonic.","2nd harmonic."],"answer":1,"answerText":"1st harmonic.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":7,"q":"The first overtone of a sound wave is the.","options":["1st harmonic.","fundamental frequency.","2nd harmonic."],"answer":2,"answerText":"2nd harmonic.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":8,"q":"Two pure tones of similar frequency are heard by a person. What will they hear?.","options":["One pure tone.","A beat of the two tones.","Two tones."],"answer":1,"answerText":"A beat of the two tones.","explanation":"At certain points, the troughs cancel the peaks. At other points the peaks 'add to' other peaks. The net effect is a low frequency oscillation in amplitude.\"."},{"topic":"5. Wave Motion and Sound.","sourceNumber":9,"q":"Two sound waves of the same frequency and amplitude are moving half a wavelength out of phase with each other. What will be heard?.","options":["Nothing.","Twice the volume of one of the sound waves.","Half the volume of one of the sound waves."],"answer":0,"answerText":"Nothing.","explanation":"The peaks will cancel the troughs."},{"topic":"5. Wave Motion and Sound.","sourceNumber":10,"q":"A fire engine is approaching you with its siren on. As it passes you its pitch.","options":["stay the same.","increases.","decreases."],"answer":2,"answerText":"decreases.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":11,"q":"Quality of sound is dependant on.","options":["number and pitch of harmonics.","medium it is traveling through.","frequency of the supply."],"answer":0,"answerText":"number and pitch of harmonics.","explanation":"Quality of sound is dependant upon the number of harmonics and the pitch."},{"topic":"5. Wave Motion and Sound.","sourceNumber":12,"q":"What frequency is a tone which is 4 times the fundamental frequency?.","options":["2nd overtone.","3rd overtone.","3rd harmonic."],"answer":1,"answerText":"3rd overtone.","explanation":"The 4th harmonic is also called the 3rd overtone."},{"topic":"5. Wave Motion and Sound.","sourceNumber":13,"q":"Intensity of sound waves.","options":["is not affected by distance.","varies inversely as the square of distance from source.","vary directly as per distance from source."],"answer":1,"answerText":"varies inversely as the square of distance from source.","explanation":"Sound diminishes with the square of the distance from the source (i.e double the distance = 1/4 the dB, triple the distance = 1/9 the dB etc.) - Technically called a log-linear scale."},{"topic":"5. Wave Motion and Sound.","sourceNumber":14,"q":"In a standing wave the point where continuous vibration of maximum amplitude occurs is called the.","options":["harmonic.","anti-node.","node."],"answer":1,"answerText":"anti-node.","explanation":"The peaks are the anti-nodes. See External website."},{"topic":"5. Wave Motion and Sound.","sourceNumber":15,"q":"The name given to sounds below that which the human ear can detect, i.e. below 20Hz is.","options":["ultra sound.","infra sound.","sonic pitch."],"answer":1,"answerText":"infra sound.","explanation":"See how silent thunder can shatter windows at External website."},{"topic":"5. Wave Motion and Sound.","sourceNumber":16,"q":"The speed of sound in dry air is 331 m/s. In a solid the speed would.","options":["increase.","decrease.","stay the same."],"answer":0,"answerText":"increase.","explanation":"Speed of sound is greater in a solid than in air."},{"topic":"5. Wave Motion and Sound.","sourceNumber":17,"q":"If a tuning fork is struck and held close to the ear and slowly rotated about the vertical axis, in one rotation how many times is there no sound?.","options":["2.","Sound is audible for the whole revolution.","4."],"answer":0,"answerText":"2.","explanation":"Two sound waves interfere creating a relatively 'dead' zone for approximately 2 quarters of the rotation."},{"topic":"5. Wave Motion and Sound.","sourceNumber":18,"q":"What is the phenomenon that occurs when a siren that approaches you, at the point of passing, the pitch decreases?.","options":["Resonance.","Doppler effect.","Echo."],"answer":1,"answerText":"Doppler effect.","explanation":"Doppler effect."},{"topic":"5. Wave Motion and Sound.","sourceNumber":19,"q":"For hearing protection, noise cancelling headphones.","options":["cannot reduce the noise from outside completely.","operate by destructive interference of sound waves.","operate by constructive interference of sound waves."],"answer":1,"answerText":"operate by destructive interference of sound waves.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":20,"q":"Tuning forks are used to vibrate musical instruments because.","options":["they produce both of the other effects described.","they produce a beat when played together with the instrument.","they produce a pure note."],"answer":2,"answerText":"they produce a pure note.","explanation":"A tuning fork produces a pure note, which can be used to tune a guitar (for example) by listening for the beat produced when played alongside an out-of-tune string."},{"topic":"5. Wave Motion and Sound.","sourceNumber":21,"q":"When an open pipe is played and a note is heard.","options":["the lowest frequency of the note is called second harmonic.","resonance occurs with standing waves set up inside the pipe.","there is a 180º phase change at the open end."],"answer":1,"answerText":"resonance occurs with standing waves set up inside the pipe.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":22,"q":"Two sound waves are the same but slightly out of phase. This means that.","options":["the beat frequency is the same.","there will be no beat frequency.","the beat frequency will be slightly different."],"answer":0,"answerText":"the beat frequency is the same.","explanation":"The beat frequency is the same frequency as either of the two frequencies."},{"topic":"5. Wave Motion and Sound.","sourceNumber":23,"q":"In a vibrating string, the point at which there is no displacement is called a.","options":["antinode.","node.","fundamental mode."],"answer":1,"answerText":"node.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":24,"q":"The amplitude of a Transverse Wave is the distance from.","options":["the top of a peak to the bottom of a trough.","half the distance from peak to trough.","one peak to the next."],"answer":1,"answerText":"half the distance from peak to trough.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":25,"q":"Increasing the Amplitude of a sound wave increases its.","options":["pitch.","moment.","loudness."],"answer":2,"answerText":"loudness.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":26,"q":"A wave in which the vibrations are perpendicular, or at right angles to the direction of wave travel is a.","options":["Dispersion Wave.","Longitudinal Wave.","Transverse Wave."],"answer":2,"answerText":"Transverse Wave.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":27,"q":"When a string vibrates, the point at which maximum displacement occurs is called the.","options":["node.","antinode.","primary node."],"answer":1,"answerText":"antinode.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":28,"q":"Increasing the frequency of a sound wave increases its.","options":["pitch.","loudness.","moment."],"answer":0,"answerText":"pitch.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":29,"q":"A wave in which the vibrations are parallel to, or along, the direction of travel is a.","options":["Transverse Wave.","Upright Wave.","Longitudinal Wave."],"answer":2,"answerText":"Longitudinal Wave.","explanation":""},{"topic":"5. Wave Motion and Sound.","sourceNumber":30,"q":"If a string is vibrating at the 3rd harmonic, it will be oscillating at.","options":["Fundamental Frequency.","4 times its fundamental frequency.","3 times its fundamental frequency."],"a
