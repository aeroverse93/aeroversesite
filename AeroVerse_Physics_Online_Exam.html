<script>
const questionBank=[{"topic":"1. Matter.","sourceNumber":1,"q":"An atom with 3 free electrons in its outer shell is said to be.","options":["pentavalent.","covalent.","trivalent."],"answer":2,"answerText":"trivalent.","explanation":"Number of electrons in the outer shell is called the valency - 1 = monovalent, 2 = divalent, 3 = trivalent etc."},{"topic":"1. Matter.","sourceNumber":2,"q":"What is the mass number of an element?.","options":["Number of electrons and protons.","Number of neutrons and protons.","Number of electrons and neutrons."],"answer":1,"answerText":"Number of neutrons and protons.","explanation":""},{"topic":"1. Matter.","sourceNumber":3,"q":"What do you get when you add 2H2 and O?.","options":["H2 O.","2H2 O.","2H2 O2 ."],"answer":1,"answerText":"2H2 O.","explanation":"Water is molecules each made up of 2 hydrogen atoms and 1 oxygen atom. Here ther is 4 hydrogen atoms, and 2 oxygen atoms, so we can make 2 water molecules."},{"topic":"1. Matter.","sourceNumber":4,"q":"The splitting of a chemical compound is called.","options":["bombardment.","synthesis.","analysis."],"answer":2,"answerText":"analysis.","explanation":""},{"topic":"1. Matter.","sourceNumber":5,"q":"What is the atomic number of an element?.","options":["The number of neutrons in the atom.","The number of electrons in the atom.","The number of protons in the atom."],"answer":2,"answerText":"The number of protons in the atom.","explanation":"NIL. http://en.wikipedia.org/wiki/Atomic_number"},{"topic":"1. Matter.","sourceNumber":6,"q":"An atom with 5 free electrons is said to be.","options":["pentavalet.","covalent.","trivalent."],"answer":2,"answerText":"trivalent.","explanation":"The valency is the number of electrons in the outer shell if that number is 4 or less. If there are more than 4 electrons, the valency is 8 minus the number of electrons. In this case 8 -5 = 3 = trivalent."},{"topic":"1. Matter.","sourceNumber":7,"q":"An atom consists of.","options":["protons, neutron and electrons.","protons and electrons.","protons and neutrons."],"answer":0,"answerText":"protons, neutron and electrons.","explanation":""},{"topic":"1. Matter.","sourceNumber":8,"q":"The maximum number of electrons in the inner shell of an atom is.","options":["8.","2.","4."],"answer":1,"answerText":"2.","explanation":""},{"topic":"1. Matter.","sourceNumber":9,"q":"The mass of a proton equals the mass of a.","options":["neutron.","beta particle.","electron."],"answer":0,"answerText":"neutron.","explanation":"Mass of a proton = mass of a neutron (well, very nearly)."},{"topic":"1. Matter.","sourceNumber":10,"q":"Catalysts.","options":["speed up reactions.","speed up and slow down reactions.","slow down reactions."],"answer":0,"answerText":"speed up reactions.","explanation":"A catalyst speeds up reactions, an inhibitor slows down reaction."},{"topic":"1. Matter.","sourceNumber":11,"q":"If the outer shell of an atom is full the the element is.","options":["unstable / reactive.","a good conductor.","practically inert."],"answer":2,"answerText":"practically inert.","explanation":""},{"topic":"1. Matter.","sourceNumber":12,"q":"Molecules of the same compound are held together by.","options":["cohesive forces.","adhesive forces.","gravitational forces."],"answer":0,"answerText":"cohesive forces.","explanation":"Cohesion is the property that causes like substances to cling together (eg water molecules, forming raindrops). Adhesion is the property that causes unlike substances to stick together (eg the raindrops stick on a washing line)."},{"topic":"1. Matter.","sourceNumber":13,"q":"Oxygen has a valency of.","options":["2.","6.","8."],"answer":0,"answerText":"2.","explanation":"Oxygen has 6 electrons in its outer shell. The valency is the number of electrons in the outer shell if that number is 4 or less. If there are more than 4 electrons, the valency is 8 minus the number of electrons. In this case 8 - 6 = 2."},{"topic":"1. Matter.","sourceNumber":14,"q":"The further from the nucleus the shells are in an atom.","options":["the shells retain the same spacing from each other.","the closer the shells get to each other.","the further the shells get from each other."],"answer":2,"answerText":"the further the shells get from each other.","explanation":"The gap between the 'energy levels' reduces, but the physical gap increases slightly. http://www.1stardrive.com/solar/chem.htm"},{"topic":"1. Matter.","sourceNumber":15,"q":"What determines an element's identity?.","options":["The number of neutrons.","The number of electrons.","The number of protons."],"answer":2,"answerText":"The number of protons.","explanation":"NIL. http://en.wikipedia.org/wiki/Atomic_number"},{"topic":"1. Matter.","sourceNumber":16,"q":"An isotope of an element will have more/less _________ than usual.","options":["electrons.","neutrons.","protons."],"answer":1,"answerText":"neutrons.","explanation":"NIL. http://en.wikipedia.org/wiki/Isotope"},{"topic":"1. Matter.","sourceNumber":17,"q":"The smallest part of an element is.","options":["a compound.","an atom.","a molecule."],"answer":1,"answerText":"an atom.","explanation":""},{"topic":"1. Matter.","sourceNumber":18,"q":"The nucleus of an atom contains.","options":["protons and electrons.","protons and neutrons.","electrons and neutrons."],"answer":1,"answerText":"protons and neutrons.","explanation":""},{"topic":"1. Matter.","sourceNumber":19,"q":"What is atomic mass?.","options":["Number of neutrons.","Number of protons plus the number of neutrons.","Number of protons."],"answer":1,"answerText":"Number of protons plus the number of neutrons.","explanation":""},{"topic":"1. Matter.","sourceNumber":20,"q":"A solid melted into a liquid will take up.","options":["less space.","the same amount of space.","more space."],"answer":0,"answerText":"less space.","explanation":"When a solid melts, its volume decreases - and then begins to increase again as the temperature of the liquid rises."},{"topic":"1. Matter.","sourceNumber":21,"q":"What form of heat is used to turn a solid into a liquid?.","options":["specific heat.","coefficient of heat.","heat of fusion."],"answer":2,"answerText":"heat of fusion.","explanation":"Fusion' is another term for melting (as in fusion welding)."},{"topic":"1. Matter.","sourceNumber":22,"q":"Change from solid to gas state without going through liquid state is called.","options":["transformation.","sublimation.","state leap."],"answer":1,"answerText":"sublimation.","explanation":"Sublimation is when a solid vapourises without first melting."},{"topic":"1. Matter.","sourceNumber":23,"q":"What is the smallest particle of matter that can exist in nature?.","options":["A molecule.","An isotope.","An atom."],"answer":2,"answerText":"An atom.","explanation":"An atom is the smallest particle of matter that can exist in nature."},{"topic":"1. Matter.","sourceNumber":24,"q":"A positive ion.","options":["has extra electrons.","has missing electrons.","is a radioactive isotope."],"answer":1,"answerText":"has missing electrons.","explanation":"A positive ion is an atom with missing electrons."},{"topic":"1. Matter.","sourceNumber":25,"q":"The isotope of a carbon atom C14 to C12 will have.","options":["same numbers of neutrons.","same numbers of protons.","same number of electrons."],"answer":1,"answerText":"same numbers of protons.","explanation":"An isotope is an atom with the same atomic number but different mass number. Atomic number is the number of protons. Mass number is the number of protons plus neutrons. Note: the number of electrons can differ from one atom to another (making ions)."},{"topic":"1. Matter.","sourceNumber":26,"q":"If an atom has 2 protons, how many electrons will it have?.","options":["1.","8.","2."],"answer":2,"answerText":"2.","explanation":"Since it is an 'atom' (and not an ion) it has the same number of electrons as protons."},{"topic":"1. Matter.","sourceNumber":27,"q":"A molecule with like atoms is said to be a.","options":["neutroid.","compound.","element."],"answer":2,"answerText":"element.","explanation":"If only one type of atom is involved, it is an element."},{"topic":"1. Matter.","sourceNumber":28,"q":"Two elements in the same substance is said to be a.","options":["mixture.","element.","compound."],"answer":2,"answerText":"compound.","explanation":"A compound is a substance formed by chemical reaction between 2 or more elements. A mixture could be 2 or more compounds. A tenuous question."},{"topic":"1. Matter.","sourceNumber":29,"q":"The number of protons in an atom is equal to the number of.","options":["electrons.","neutrons.","mass number."],"answer":0,"answerText":"electrons.","explanation":"No. of protons = No. of electrons, or it is not an atom."},{"topic":"1. Matter.","sourceNumber":30,"q":"The charge of an electron is.","options":["neutral.","negative.","positive."],"answer":1,"answerText":"negative.","explanation":"Electrons are negative."},{"topic":"1. Matter.","sourceNumber":31,"q":"A valance electron is an electron.","options":["in the innermost shell.","in the outermost shell.","which is not within an atom."],"answer":1,"answerText":"in the outermost shell.","explanation":"The outer shell is the valence shell."},{"topic":"1. Matter.","sourceNumber":32,"q":"Molecules of unlike atoms are combined by their.","options":["adhesive force.","magnetic force.","cohesive force."],"answer":0,"answerText":"adhesive force.","explanation":"Cohesion is the property that causes like substances to cling together (eg water molecules, forming raindrops - from 'cohesion' meaning to stick together). Adhesion is the property that causes unlike substances to stick together (eg the raindrops stick, or 'adhere to' a washing line)."},{"topic":"1. Matter.","sourceNumber":33,"q":"What is the difference between hydrogen, deuterium and tritium?.","options":["The number of electrons.","The number of protons.","The number of neutrons."],"answer":2,"answerText":"The number of neutrons.","explanation":"There are three isotopes of the element hydrogen: hydrogen, deuterium, and tritium. They each have one single proton (Z=1), but differ in the number of their neutrons. Hydrogen has no neutron, deuterium has one, and tritium has two neutrons."},{"topic":"1. Matter.","sourceNumber":34,"q":"The smallest material in the universe is.","options":["an ion.","helium.","hydrogen."],"answer":2,"answerText":"hydrogen.","explanation":"Hydrogen is the smallest known element, having just 1 electron and 1 proton and no neutrons."},{"topic":"1. Matter.","sourceNumber":35,"q":"What is the atomic number of the element shown here?.","options":["7.","3.","4."],"answer":1,"answerText":"3.","explanation":"The atomic number is the number of protons and is always the smallest number (and yes, the element shown is not possible)."},{"topic":"1. Matter.","sourceNumber":36,"q":"What is the mass number of the element shown here?.","options":["4.","5.","9."],"answer":1,"answerText":"5.","explanation":"The mass number is the number of protons + the number of neutrons and is always the biggest of the 2 numbers."},{"topic":"1. Matter.","sourceNumber":37,"q":"There are solids, liquids and gases present in the universe and every unit of theirs occupy some space. This is called.","options":["matter.","compound.","mass."],"answer":0,"answerText":"matter.","explanation":"All material in space is known as matter. (All matter 'has' mass, but that is not what the question asks - what is it known as, not, what does it have)."},{"topic":"1. Matter.","sourceNumber":38,"q":"An atom deficient of a valency electron is deficient.","options":["of an electron in the outer shell.","of a neutron in the outer shell.","of an electron in the inner shell."],"answer":0,"answerText":"of an electron in the outer shell.","explanation":"The valency electrons are in the outer shell."},{"topic":"1. Matter.","sourceNumber":39,"q":"The maximum number of electrons in the second shell is.","options":["4.","8.","2."],"answer":1,"answerText":"8.","explanation":"Try the formula '2n-squared', where 'n' is the shell number. In this case 2 * (2 * 2) = 8."},{"topic":"1. Matter.","sourceNumber":40,"q":"What does an oxygen atom consist of?.","options":["Protons, neutrons and electrons.","Protons and electrons.","Protons and neutrons."],"answer":0,"answerText":"Protons, neutrons and electrons.","explanation":"All atoms have protons, neutrons and electrons (except hydrogen, which has no neutrons)."},{"topic":"1. Matter.","sourceNumber":41,"q":"Surface molecular attraction between two different molecules is.","options":["adhesive.","gravitational.","cohesive."],"answer":0,"answerText":"adhesive.","explanation":"Cohesion is the property that causes like substances to cling together (e.g. water molecules, forming raindrops - from 'cohesion' meaning to stick together). Adhesion is the property that causes unlike substances to stick together (e.g. the raindrops stick, or 'adhere to' a washing line)."},{"topic":"1. Matter.","sourceNumber":42,"q":"The atomic mass number is the number of.","options":["protons plus electrons.","neutrons plus electrons.","protons plus neutrons."],"answer":2,"answerText":"protons plus neutrons.","explanation":"Mass Number is the number of protons + neutrons."},{"topic":"1. Matter.","sourceNumber":43,"q":"A catalyst in a chemical reaction does what?.","options":["Can either speed it up or slow it down.","Speeds it up.","Slows it down."],"answer":1,"answerText":"Speeds it up.","explanation":"Official definition of 'catalyst': A substance that increases the rate of a chemical reaction by reducing the activation energy, but which is left unchanged by the reaction."},{"topic":"1. Matter.","sourceNumber":44,"q":"What is the number of electrons in the inner-most shell of an atom?.","options":["4.","8.","2."],"answer":2,"answerText":"2.","explanation":"The inner shell of an atom has 2 electrons."},{"topic":"1. Matter.","sourceNumber":45,"q":"What form of heat is used to turn a solid into a gas?.","options":["Sensible heat.","Specific heat.","Latent heat."],"answer":2,"answerText":"Latent heat.","explanation":"To change any state, the heat required is called 'latent heat'."},{"topic":"1. Matter.","sourceNumber":46,"q":"The heat required to change a liquid to a gas at constant temperature is the heat of.","options":["fusion.","condensation.","vaporisation."],"answer":2,"answerText":"vaporisation.","explanation":"The heat required to turn a liquid into a gas (vaporise) is called the 'latent heat of vaporisation'."},{"topic":"1. Matter.","sourceNumber":47,"q":"An atom with a full outer shell is.","options":["practically inert.","a good insulator.","a good conductor."],"answer":0,"answerText":"practically inert.","explanation":"An atom with a full outer shell is practically inert."},{"topic":"1. Matter.","sourceNumber":48,"q":"An element with a full valence shell is.","options":["very reactive.","good conductor.","inert."],"answer":2,"answerText":"inert.","explanation":"An element with a full valence shell is inert."},{"topic":"1. Matter.","sourceNumber":49,"q":"A substance of two or more different atoms is.","options":["a neutrino.","an isotope.","a chemical compound."],"answer":2,"answerText":"a chemical compound.","explanation":"A compound is two or more different atoms."},{"topic":"1. Matter.","sourceNumber":50,"q":"An atom with 5 electrons in its outer shell is.","options":["trivalent.","pentavelent.","covalent."],"answer":0,"answerText":"trivalent.","explanation":"Valency is the number of electrons in the outer shell (up to 4) or 8 minus the number of electrons in the outer shell (over 4)."},{"topic":"1. Matter.","sourceNumber":51,"q":"Protons have.","options":["no charge.","positive charge.","negative charge."],"answer":1,"answerText":"positive charge.","explanation":"Protons are positively charged."},{"topic":"1. Matter.","sourceNumber":52,"q":"Producing a compound from commonly available materials is.","options":["synthesis.","analysis.","bombardment."],"answer":0,"answerText":"synthesis.","explanation":"Making a compound is called synthesis, breaking it apart is called analysis."},{"topic":"1. Matter.","sourceNumber":53,"q":"A different number of nucleons in the nucleus of atoms would represent.","options":["semiconductor.","isotopes.","isotones."],"answer":1,"answerText":"isotopes.","explanation":"An Isotope is an element with a 'wrong' number of neutrons."},{"topic":"1. Matter.","sourceNumber":54,"q":"Molecules of matter are in constant motion. The amount of vibration or motion is dependent on.","options":["temperature.","volume.","pressure."],"answer":0,"answerText":"temperature.","explanation":"Temperature produces molecular motion."},{"topic":"1. Matter.","sourceNumber":55,"q":"When a chemical change takes place, the smallest particle indivisible in an element is called.","options":["an atom.","an electron.","a neutron."],"answer":0,"answerText":"an atom.","explanation":"An atom is the smallest particle in an element. Particles smaller than that (neutrons, protons, electrons) do not define an element."},{"topic":"1. Matter.","sourceNumber":56,"q":"A nucleus of an atom consists of.","options":["positively charged particles.","a nucleus and normally has no overall charge at all and so is neutral.","negatively charged particles."],"answer":0,"answerText":"positively charged particles.","explanation":"Protons are positive, neutrons are neutral."},{"topic":"1. Matter.","sourceNumber":57,"q":"A compound is a.","options":["mixture of more than one element which are chemically bonded together.","solution (either liquid or solid) of elements or mixtures of elements to form a new material.","mixture of more than one element which are mixed together."],"answer":0,"answerText":"mixture of more than one element which are chemically bonded together.","explanation":"A compound is two or more elements chemically bonded."},{"topic":"1. Matter.","sourceNumber":58,"q":"A compound such as water can exist in how many states?.","options":["2.","3.","1."],"answer":1,"answerText":"3.","explanation":"Solid, liquid, gas."},{"topic":"1. Matter.","sourceNumber":59,"q":"Select the correct statement from the following.","options":["Temperature is the only factor which can affect the state in which matter exists.","Matter can only exist in one of three states.","As temperature rises a solid will always become a liquid and then a gas."],"answer":1,"answerText":"Matter can only exist in one of three states.","explanation":"Solid, liquid, gas. Pressure also affects the state in which matter exists."},{"topic":"1. Matter.","sourceNumber":60,"q":"Isotopes of an element have.","options":["a different atomic number.","the same number of neutrons but a different number of protons.","the same number of protons but a different number of neutrons."],"answer":2,"answerText":"the same number of protons but a different number of neutrons.","explanation":""},{"topic":"1. Matter.","sourceNumber":61,"q":"Neutrons have.","options":["no charge.","a positive charge.","a negative charge."],"answer":0,"answerText":"no charge.","explanation":""},{"topic":"1. Matter.","sourceNumber":62,"q":"Atomic MASS number is the number of.","options":["protons.","protons and neutrons.","electrons."],"answer":1,"answerText":"protons and neutrons.","explanation":"Mass number is the total number of items in the nucleus (protons and neutrons)."},{"topic":"1. Matter.","sourceNumber":63,"q":"How many electrons does an `S` orbital hold?.","options":["6.","8.","2."],"answer":2,"answerText":"2.","explanation":"How many electrons does an `S` orbital hold?."},{"topic":"1. Matter.","sourceNumber":64,"q":"The number of electrons in a stable atom equals.","options":["the number of neutrons in the nucleus.","the number of protons and neutrons in the nucleus.","the number of protons in the nucleus."],"answer":2,"answerText":"the number of protons in the nucleus.","explanation":"Electrons = Protons (to cancel the electrical charge)."},{"topic":"1. Matter.","sourceNumber":65,"q":"An isotope of an element has.","options":["the same atomic number but a different mass number.","the same mass number but a different atomic number.","a different mass and atomic number."],"answer":0,"answerText":"the same atomic number but a different mass number.","explanation":"NIL. http://en.wikipedia.org/wiki/Isotope"},{"topic":"1. Matter.","sourceNumber":66,"q":"The mass number of an element is based on.","options":["the total number of protons and neutrons in its nucleus.","the number of protons in its nucleus.","the number of neutrons in its nucleus."],"answer":0,"answerText":"the total number of protons and neutrons in its nucleus.","explanation":"NIL. http://chemistry.about.com/library/glossary/bldef57040.htm"},{"topic":"1. Matter.","sourceNumber":67,"q":"The atomic weight of all atoms is related to.","options":["Hydrogen.","Carbon.","Helium."],"answer":1,"answerText":"Carbon.","explanation":"NIL. http://education.yahoo.com/reference/dictionary/entry/atomic%20weight"},{"topic":"1. Matter.","sourceNumber":68,"q":"The chemical bonding of two or more elements is called.","options":["chemical analysis.","chemical synthesis.","chemical fusion."],"answer":1,"answerText":"chemical synthesis.","explanation":"NIL. http://en.wikipedia.org/wiki/Chemical_synthesis"},{"topic":"1. Matter.","sourceNumber":69,"q":"Two or more elements that are chemically bonded together and have an even mass distribution form a.","options":["mixture.","substance.","chemical compound."],"answer":2,"answerText":"chemical compound.","explanation":"When elements bond chemically, they make a compound."},{"topic":"1. Matter.","sourceNumber":70,"q":"An atom that gains one or more additional electrons is called.","options":["a negative ion.","a positive ion.","an isotope."],"answer":0,"answerText":"a negative ion.","explanation":"Electrons are negatively charged, so additional electrons make an atom into a negative ion."},{"topic":"1. Matter.","sourceNumber":71,"q":"Ionic bonding involves.","options":["electron sharing.","attraction to a free electron cloud.","electron transfer."],"answer":2,"answerText":"electron transfer.","explanation":"Ionic bonding is formed when electrons are transferred."},{"topic":"1. Matter.","sourceNumber":72,"q":"Non-metals form.","options":["covalent bonds.","ionic bond.","metallic bonds."],"answer":0,"answerText":"covalent bonds.","explanation":"Non-metals usually form covalent bonds."},{"topic":"1. Matter.","sourceNumber":73,"q":"Brownian Movement describes.","options":["Brownian Movement describes.","the attraction of electrons.","the motion of molecules."],"answer":2,"answerText":"the motion of molecules.","explanation":"NIL. http://www.hyperdictionary.com/dictionary/Brownian+movement"},{"topic":"1. Matter.","sourceNumber":74,"q":"Elements on the extreme right of the periodic table are.","options":["Metals.","Non-metals.","Transition metals."],"answer":1,"answerText":"Non-metals.","explanation":"NIL. http://science.howstuffworks.com/atom8.htm"},{"topic":"1. Matter.","sourceNumber":75,"q":"Oxygen, atomic number 8 is.","options":["trivalent.","univalent.","bivalent."],"answer":2,"answerText":"bivalent.","explanation":"NIL. http://www.sil.org/linguistics/GlossaryOfLinguisticTerms/WhatIsValency.htm"},{"topic":"1. Matter.","sourceNumber":76,"q":"The atomic number of the atom of an element is based on.","options":["the number of neutrons in to nucleus.","the number of protons in its nucleus.","the total number of protons and neutrons in its nucleus."],"answer":1,"answerText":"the number of protons in its nucleus.","explanation":"NIL. http://www.hyperdictionary.com/dictionary/atomic+number"},{"topic":"1. Matter.","sourceNumber":77,"q":"Water is.","options":["an element.","a mixture.","a compound."],"answer":2,"answerText":"a compound.","explanation":""},{"topic":"1. Matter.","sourceNumber":78,"q":"The Mass of a Proton is approximately.","options":["equal to the mass of an electron.","equal to the relative mass of a molecule.","2000 times greater than the mass of an electron."],"answer":2,"answerText":"2000 times greater than the mass of an electron.","explanation":""},{"topic":"1. Matter.","sourceNumber":79,"q":"Noble gases are _______ and _______ and have a full outer shell of electrons.","options":["fluorine and neon.","sulphur and neon.","helium, neon, argon."],"answer":2,"answerText":"helium, neon, argon.","explanation":"NIL. http://www.chemicalelements.com/groups/noblegases.html"},{"topic":"1. Matter.","sourceNumber":80,"q":"If a hydrogen atom has 2 neutrons and 1 proton what kind of water would you get?.","options":["Fresh water.","Heavy water.","Salt water."],"answer":1,"answerText":"Heavy water.","explanation":"Heavy water - water containing a substantial proportion of deuterium atoms, used in nuclear reactors."},{"topic":"1. Matter.","sourceNumber":81,"q":"A majority of an atom's mass is in the.","options":["compound.","isotope.","nucleus."],"answer":2,"answerText":"nucleus.","explanation":"NIL. http://en.wikipedia.org/wiki/Atom 2.1. Mechanics – Statics."},{"topic":"1. Matter.","sourceNumber":1,"q":"An insulator has its electrons.","options":["tightly bound.","loosely bound.","otally free from the atoms."],"answer":0,"answerText":"tightly bound.","explanation":"Aircraft Electricity & Electronics 5th edition TK Eismin."},{"topic":"1. Matter.","sourceNumber":2,"q":"The centre of gravity of an aircraft is adjusted by two weights, 10 kg and 5 ckg plaed 4m and 2 m aft of the c of g. To what position must a 20 kg weight be added to balance the c of g?.","options":["2.5m.","4m.","2m."],"answer":0,"answerText":"2.5m.","explanation":"(10 * 4) + (5 * 2) = 20 x ? 40+10=20 x ? ? = 2.5m."},{"topic":"1. Matter.","sourceNumber":3,"q":"For the CGS system, the force is.","options":["the 'N' which produces an acceration of 1 cm/s2 for a mass of gram.","the 'dyne' which produces an acceleration of 1cm/s2 for a mass of gram.","the 'pd1' which produces an acceleration of 1 cm/s2 for a mass of gram."],"answer":1,"answerText":"the 'dyne' which produces an acceleration of 1cm/ s2 for a mass of gram.","explanation":""},{"topic":"1. Matter.","sourceNumber":4,"q":"The quadrature component of a vector is.","options":["45° to the original.","90° to the original.","180° to the original."],"answer":1,"answerText":"90° to the original.","explanation":""},{"topic":"1. Matter.","sourceNumber":5,"q":"1 Newton is equal to.","options":["1 kilogram meter per second per second.","1 kilogram of force.","1 joule per second."],"answer":0,"answerText":"1 kilogram meter per second per second.","explanation":"Remember Newtons 2nd law 'F=ma'. Well, 'm' is in kilograms, 'a' is in metres per second squared (or meters per second per second) so put the two together and 'F' is…."},{"topic":"1. Matter.","sourceNumber":6,"q":"The SI unit of mass is the.","options":["metre (m).","pound (lb).","kilogram (kg)."],"answer":2,"answerText":"kilogram (kg).","explanation":""},{"topic":"1. Matter.","sourceNumber":7,"q":"A slug is a unit of.","options":["speed.","mass.","weight."],"answer":1,"answerText":"mass.","explanation":"A very old unit of mass - equal to 14.6 kg."},{"topic":"1. Matter.","sourceNumber":8,"q":"If an object in air is submerged in a liquid or a gas its weight will.","options":["increase.","decrease.","remain the same."],"answer":2,"answerText":"remain the same.","explanation":"thing that can change the weight of an object is the gravitational field it is in."},{"topic":"1. Matter.","sourceNumber":9,"q":"If a material is loaded excessively and is permanently deformed, it is said to be.","options":["stretched.","stressed.","strained."],"answer":2,"answerText":"strained.","explanation":"Strain = extension / original length (Stress = force / area)."},{"topic":"1. Matter.","sourceNumber":10,"q":"The SI unit of force is the.","options":["Newton (N).","Metre (m).","Pascal (Pa)."],"answer":0,"answerText":"Newton (N).","explanation":""},{"topic":"1. Matter.","sourceNumber":11,"q":"The formula for calculating stress is.","options":["load divided by cross sectional area.","area divided by load.","load multiplied by cross sectional area."],"answer":0,"answerText":"load divided by cross sectional area.","explanation":""},{"topic":"1. Matter.","sourceNumber":12,"q":"Stress is given by.","options":["force per unit area.","extension per original length.","force per original length."],"answer":0,"answerText":"force per unit area.","explanation":""},{"topic":"1. Matter.","sourceNumber":13,"q":"The force which opposes twisting deformation is.","options":["torsion.","strain.","shear."],"answer":0,"answerText":"torsion.","explanation":"A torsional force opposes twisting."},{"topic":"1. Matter.","sourceNumber":14,"q":"A force perpendicular to a beam produces what type of stress?.","options":["compressive.","shear.","tensile."],"answer":1,"answerText":"shear.","explanation":"perpendicular to a beam (such a s a man on a diving board) produces bending and shear stress."},{"topic":"1. Matter.","sourceNumber":15,"q":"The extension of a spring can be determined using.","options":["Charles' Law.","Newton's 2nd Law.","Hooke's Law."],"answer":2,"answerText":"Hooke's Law.","explanation":"Hooke's law is 'extension is proportional to force'."},{"topic":"1. Matter.","sourceNumber":16,"q":"When a steel bar is overstressed, what is the name of the point at which it does not return to its original form after the load is released?.","options":["Ultimate point.","Yield point.","Young's modulus."],"answer":1,"answerText":"Yield point.","explanation":""},{"topic":"1. Matter.","sourceNumber":17,"q":"Two couples with magnitude F act against each other. The resultant will be.","options":["-2F.","2F.","0."],"answer":2,"answerText":"0.","explanation":"A 'couple' is 2 forces acting in the same rotational direction an equal distance from a pivot point (like turning a die holder). Two couples in opposition will cancel each other."},{"topic":"1. Matter.","sourceNumber":18,"q":"The height of mercury required to give 1 bar is.","options":["700 mm.","1000 mm.","760 mm."],"answer":2,"answerText":"760 mm.","explanation":"1 bar is almost atmospheric pressure."},{"topic":"1. Matter.","sourceNumber":19,"q":"A vessel has 25 ml of water which produces 10 kPa. If another 125 ml of water is added, what will be the pressure in the vessel?.","options":["40 kPa.","50 kPa.","60 kPa."],"answer":2,"answerText":"60 kPa.","explanation":"pressure = density * gravity * height. 25ml + 125ml = 150ml or 6 times. So 6 * height = 6 * pressure."},{"topic":"1. Matter.","sourceNumber":20,"q":"Two hydraulic jacks with different diameters have the same fluid pressures entering at the same rate. They will extend at.","options":["the same rate until the smaller jack becomes full.","the same rate.","different rates."],"answer":2,"answerText":"different rates.","explanation":"diameter will have the greater force. The 'trade-off' for this is that it will move slower."},{"topic":"1. Matter.","sourceNumber":21,"q":"What load can be lifted on jack B?.","options":["300N.","200N.","100N."],"answer":2,"answerText":"100N.","explanation":"10 times the area, then it can lift 10 times the load."},{"topic":"1. Matter.","sourceNumber":22,"q":"The most common method of expressing pressure is in.","options":["inch pounds per square inch.","grams per square inch.","pounds per square inch."],"answer":2,"answerText":"pounds per square inch.","explanation":"Pressure is usually measured in Pounds per Square Inch (PSI)."},{"topic":"1. Matter.","sourceNumber":23,"q":"The difference between two pressures is.","options":["vacuum pressure.","differential pressure.","static pressure."],"answer":1,"answerText":"differential pressure.","explanation":"Differential pressure is the difference between two pressures (such as inside and outside the aircraft cabin)."},{"topic":"1. Matter.","sourceNumber":24,"q":"What torque loading would you apply to a nut if the force is 50 lbs, exerted 2 feet from its axis?.","options":["100 lbs.ft.","600 lbs.ft.","251 lbs.ft."],"answer":0,"answerText":"100 lbs.ft.","explanation":"Torque loading = force * distance."},{"topic":"1. Matter.","sourceNumber":25,"q":"In a jack with a ram only on one side and hydraulic fluid applied from both sides.","options":["a condition of hydraulic lock exists and no movement will take place.","the ram will move opposite to the side where the ram is due to pressure acting on differential areas.","the ram will move to the side where the ram is, due to pressure acting on differential areas."],"answer":1,"answerText":"the ram will move opposite to the side where the ram is due to pressure acting on differential areas.","explanation":"The non-ram side has a greater area, so the ram will be pushed from that side to the ram side."},{"topic":"1. Matter.","sourceNumber":26,"q":"Using the same hydraulic pressure, the force applied by a hydraulic jack of 4 sq. inch piston area.","options":["will be half that applied by a similar jack of 2 sq. inch piston area.","will be equal to that applied by a similar jack of 2 sq. inch piston area.","will be twice that applied by a similar jack of 2 sq. inch piston area."],"answer":1,"answerText":"will be equal to that applied by a similar jack of 2 sq. inch piston area.","explanation":"Force = pressure * area."},{"topic":"1. Matter.","sourceNumber":27,"q":"A pressure of 100 PSI acts on two jacks in a hydraulic system, having piston areas 2 sq in and 4 sq in.","options":["the smaller jack will exert a force of 50 lb and the larger a force of 25 lb.","the smaller jack will exert a force of 200 lb and the larger a force of 400 lb.","the two jacks will exert the same force."],"answer":1,"answerText":"the smaller jack will exert a force of 200 lb and the larger a force of 400 lb.","explanation":"Force = pressure * area. 100 * 2 = 200 lbs. 100 * 4 = 400 lbs."},{"topic":"1. Matter.","sourceNumber":28,"q":"The purpose of an accumulator in a hydraulic system is to.","options":["collect air from the hydraulic fluid, thus reducing the requirement for frequent bleeding.","relieve excess pressure.","store hydraulic fluid under pressure."],"answer":2,"answerText":"store hydraulic fluid under pressure.","explanation":"An accumulator stores hydraulic pressure for use when the main pressure pump fails."},{"topic":"1. Matter.","sourceNumber":29,"q":"If the hydraulic system accumulator has a low air pressure, it will cause.","options":["rapid pressure fluctuations during operation of services.","rapid movement of the operating jacks.","slow build up of pressure in the system."],"answer":0,"answerText":"rapid pressure fluctuations during operation of services.","explanation":"The secondary purpose of an accumulator is to damp out pressure fluctuations."},{"topic":"1. Matter.","sourceNumber":30,"q":"The specific torque loading for a bolt is 50 lbs.ins but an extension of 2 inches is needed to reach the bolt in addition to the 8 inches torque wrench. What will the actual reading?.","options":["54 lb.ins.","40 lb.ins.","60 lb.ins."],"answer":1,"answerText":"40 lb.ins.","explanation":"New torque reading = desired torque x L/(x+L). 50 * 8/10 = 40 lb.ins."},{"topic":"1. Matter.","sourceNumber":31,"q":"If 1500 psi hydraulic pressure is pumped into an accumulator, with a pre-charge air pressure of 1000 psi the gauge will read.","options":["2500 psi.","1500 psi.","1000 psi."],"answer":1,"answerText":"1500 psi.","explanation":"The accumulator pressure gauge reads the hydraulic pressure only when it is above the charge pressure."},{"topic":"1. Matter.","sourceNumber":32,"q":"Young's modulus is.","options":["stress * strain.","strain / stress.","stress / strain."],"answer":0,"answerText":"stress / strain.","explanation":"Young's Modulus (E) is the ratio Stress / Strain."},{"topic":"1. Matter.","sourceNumber":33,"q":"A cylinder filled with water to half a metre will exert a pressure of.","options":["4.9 Pa.","4900 Pa.","49 Pa."],"answer":1,"answerText":"4900 Pa.","explanation":"Pressure = density * gravity * height = 1000 (for water) * 10 * 0.5 = 5000 Pa. Answer is 4900 Pa because gravity is slightly less than 10 (9.81 to be exact)."},{"topic":"1. Matter.","sourceNumber":34,"q":"A mass of 10kg placed 2 metres away from a pivot will have a moment of.","options":["196 NM.","50 NM.","20 NM."],"answer":0,"answerText":"196 NM.","explanation":"10 kg = 10 * 9.8 = 98N. Moment = force * radius = 98 * 2 = 196 Nm."},{"topic":"1. Matter.","sourceNumber":35,"q":"25 litres of fuel exerts a pressure of 10KPa. If a further 125 litres is added, the pressure will now be.","options":["50 kPa.","60 kPa.","40 kPa."],"answer":1,"answerText":"60 kPa.","explanation":"Total Fuel = 150 litres = 6 * 25. 6 * original pressure = 60 kPa."},{"topic":"1. Matter.","sourceNumber":36,"q":"1000 lb/in2 is in an accumulator. If 3000 lb/in2 of hydraulic fluid is pumped in, what is the pressure on the air side?.","options":["3000 lb/in2.","4000 lb/in2.","1000 lb/in2."],"answer":0,"answerText":"3000 lb/in2.","explanation":"The piston does not move until the hydraulic pressure exceeds 1000 psi. From then on, the air and hydraulic pressures are equal (at all times that the piston is off its stops)."},{"topic":"1. Matter.","sourceNumber":37,"q":"A fractional decrease in volume of a material when it is compressed is a function of the.","options":["compressive strain.","compressive strain.","bulk modulus."],"answer":2,"answerText":"bulk modulus.","explanation":"Bulk modulus = ratio of change in pressure to the fractional volume compression."},{"topic":"1. Matter.","sourceNumber":38,"q":"A ram has a piston with 2 in2. Another ram with a piston of 2 4 in will provide.","options":["the same force.","double the force.","square the force."],"answer":1,"answerText":"double the force.","explanation":"Double the area = double the force. (However, if the question said double the radius or diameter, the force is a square of that, i.e 4x)."},{"topic":"1. Matter.","sourceNumber":39,"q":"How much force is exerted by piston if it is subjected to a pressure of 3000 Pa and has surface area of 2.5 m2?.","options":["7500 N.","3000 N.","1200 N."],"answer":0,"answerText":"7500 N.","explanation":"Force = pressure * area = 3000 * 2.5 = 7.5 N."},{"topic":"1. Matter.","sourceNumber":40,"q":"A force of 10 million Newton’s is expressed numerically as.","options":["10 MN.","10 MN.","1 MN."],"answer":0,"answerText":"10 MN.","explanation":"million Newtons = 10 MN (MegaNewtons)."},{"topic":"1. Matter.","sourceNumber":41,"q":"A millilitre is equal to.","options":["one million litres.","one millionth of a litre.","one thousandth of a litre."],"answer":2,"answerText":"one thousandth of a litre.","explanation":"A millilitre = 1/1000 litre."},{"topic":"1. Matter.","sourceNumber":42,"q":"If a square has an area of 9m2, one side is.","options":["3 m.","3 m2 .","3 sq. m."],"answer":0,"answerText":"3 m.","explanation":"3 m * 3m = 9 m2."},{"topic":"1. Matter.","sourceNumber":43,"q":"A vector quantity is a quantity which.","options":["possesses sense, magnitude and direction.","possesses direction only.","possesses sense only."],"answer":0,"answerText":"possesses sense, magnitude and direction.","explanation":"A vector quantity has magnitude AND direction. (sense and direction are the same thing)."},{"topic":"1. Matter.","sourceNumber":44,"q":"One atmosphere is equal to. 2","options":["1.22 kg/m .","14.7 lbf/in2.","28.9 inches of Hg."],"answer":1,"answerText":"14.7 lbf/in2.","explanation":"atmosphere = 14.7 pounds-force (lbf) per square inch."},{"topic":"1. Matter.","sourceNumber":45,"q":"Strain is calculated by.","options":["Original Length * Extension.","Extension ÷ Original Length.","Original Length ÷ Extension."],"answer":1,"answerText":"Extension ÷ Original Length.","explanation":"Strain = change in length divided by original length."},{"topic":"1. Matter.","sourceNumber":46,"q":"When a twisting force is applied to a bolt, what stress is exerted on to the head?.","options":["Shear.","Compressive.","Torsion."],"answer":2,"answerText":"Torsion.","explanation":"A twisting force applied to a bolt produces 'torsion stress' (which technically is a form of shear)."},{"topic":"1. Matter.","sourceNumber":47,"q":"When you overstress a steel bar, what is the point called where it does not return to its original form?.","options":["Plastic limit.","Elasticity limit.","Deformation limit."],"answer":1,"answerText":"Elasticity limit.","explanation":"The point at which the stressed bar does not return to its original form is called the 'elastic limit'."},{"topic":"1. Matter.","sourceNumber":48,"q":"The formula for calculating shear is.","options":["force ÷ cross-sectional area.","force * area.","force ÷ area parallel to the force."],"answer":2,"answerText":"force ÷ area parallel to the force.","explanation":"Formula for shear (stress) is Shear stress = force/area parallel to force."},{"topic":"1. Matter.","sourceNumber":49,"q":"A force 10 N is placed 2 Meters from a pivot point, what is the moment?.","options":["20 Nm.","20 Nm.","80 Nm."],"answer":0,"answerText":"20 Nm.","explanation":"N at 2 m distance produces 10 * 2 = 20 Nm."},{"topic":"1. Matter.","sourceNumber":50,"q":"If a tensile load is placed on a bar, it will.","options":["bend.","crush.","stretch."],"answer":2,"answerText":"stretch.","explanation":"tensile load placed on a bar will stretch it."},{"topic":"1. Matter.","sourceNumber":51,"q":"What atmospheric conditions will cause the true landing speed of an aircraft to be highest?.","options":["Low temp, high humidity.","Head wind, low humidity.","High temp, high humidity."],"answer":2,"answerText":"High temp, high humidity.","explanation":"Lift is least at low density. Density is lowest at high temperature and high humidity."},{"topic":"1. Matter.","sourceNumber":52,"q":"Structures designed to withstand compression are called a.","options":["tie.","strut.","beam."],"answer":1,"answerText":"strut.","explanation":"Tension - Tie, Compression - Strut, Bending - Beam."},{"topic":"1. Matter.","sourceNumber":53,"q":"1 Pascal equals.","options":["105 N/m2.","1 N/m2.","10 Nm."],"answer":1,"answerText":"1 N/m2.","explanation":"1 Pa = 1 N/m2."},{"topic":"1. Matter.","sourceNumber":54,"q":"The addition of 2 different vectors to produce another vector is called.","options":["component.","resolution.","resultant."],"answer":2,"answerText":"resultant.","explanation":"The resultant of two vectors. The mathematical process is actually called 'composition'."},{"topic":"1. Matter.","sourceNumber":55,"q":"Two items weighing 11kg and 8kg are placed 2m and 1m respectively aft of the C of G of an aircraft. How far forward of the C of G must a weight of 30kg be placed so as not to change the C of G?.","options":["2m.","1.5m.","1m."],"answer":2,"answerText":"1m.","explanation":"Total moment = (11*2) + (8*1) = 30kgm. The 30 kg mass must be placed such that 30kg * Xm = 30 kg m. Hence X = 1m."},{"topic":"1. Matter.","sourceNumber":56,"q":"A point at which the total force of a body acts is known as the.","options":["centre of gravity.","point of equilibrium.","centre of mass."],"answer":0,"answerText":"centre of gravity.","explanation":"If by force they mean 'weight' then it is Centre of Gravity."},{"topic":"1. Matter.","sourceNumber":57,"q":"A load of 600N is suspended by a cable. If the stress in the cable is said to be limited to 15N/mm2 the minimum cross sectional area of the cable must be.","options":["0.025mm2.","9000mm2.","40mm2."],"answer":2,"answerText":"40mm2.","explanation":"Stress = Force/Area. Area = Force/Stress = 600/15 = 40mm2."},{"topic":"1. Matter.","sourceNumber":58,"q":"A spring, operating within its elastic range, shortens by 60mm when a load of 480N is applied to it. Calculate the total shortening when the load is increased by 120N.","options":["82mm.","45mm.","75mm."],"answer":2,"answerText":"75mm.","explanation":"600/480 * 60 = 75mm."},{"topic":"1. Matter.","sourceNumber":59,"q":"The c.g. of a triangular plate is at the intersection of.","options":["medians from a vertex to the opposite side.","angle bisectors.","perpendicular bisectors."],"answer":0,"answerText":"medians from a vertex to the opposite side.","explanation":""},{"topic":"1. Matter.","sourceNumber":60,"q":"When a square block of material is pushed into a parallelogram, the material is under what stress type?.","options":["Compression.","Torsion.","Shear."],"answer":2,"answerText":"Shear.","explanation":"NIL. http://groups.physics.umn.edu/demo/old_page/demo_gifs/1R30_20.GIF"},{"topic":"1. Matter.","sourceNumber":61,"q":"A quantity which has size but no direction is called a.","options":["Scalar.","Moment.","Vector."],"answer":0,"answerText":"Scalar.","explanation":"scalar has size only (mass, area etc.). A vector has size and direction (velocity, force etc.)."},{"topic":"1. Matter.","sourceNumber":62,"q":"The advantage of using a machine is.","options":["mechanical advantage of input.","mechanical advantage of output.","input work is less than the output work."],"answer":1,"answerText":"mechanical advantage of output.","explanation":"Mechanical advantage is usually on the outp."},{"topic":"1. Matter.","sourceNumber":63,"q":"Which of the following can transmit pressure?.","options":["Liquids and gases.","Solids and gases.","Any matter can transmit pressure, depending on temperature."],"answer":0,"answerText":"Liquids and gases.","explanation":""},{"topic":"1. Matter.","sourceNumber":64,"q":"A moment is created by a force of 5N acting 4m from the pivot on a uniform bar. At what distance must a force of 10N be applied to balance the beam?.","options":["8 m.","4 m.","2 m."],"answer":2,"answerText":"2 m.","explanation":"5 * 4 = 20, 10 * X = 20 X = 2m."},{"topic":"1. Matter.","sourceNumber":65,"q":"A lever of length 105 cm is used with a fulcrum placed 15 cm from the end bearing the load. Its mechanical advantage is.","options":["1/6.","7.","6."],"answer":2,"answerText":"6.","explanation":"The TOTAL length is 105 cm, so the input end is 90 cms. 90/15 = 6."},{"topic":"1. Matter.","sourceNumber":66,"q":"The stress created when a material is pulled apart is called.","options":["tension.","torsion.","compression."],"answer":0,"answerText":"tension.","explanation":""},{"topic":"1. Matter.","sourceNumber":67,"q":"The yield point of a material is the point at which.","options":["strain becomes proportional to stress.","the material ruptures or breaks.","permanent deformation takes place."],"answer":2,"answerText":"permanent deformation takes place.","explanation":""},{"topic":"1. Matter.","sourceNumber":68,"q":"Assuming constant temperature. If a steel bar of length 2 m deforms to a length of 2.2 m under applied load. The strain is.","options":["1.1.","0.9.","0.1."],"answer":2,"answerText":"0.1.","explanation":"Strain = Extension/Original Length = 0.2/2 = 0.1."},{"topic":"1. Matter.","sourceNumber":69,"q":"A Scalar quantity has.","options":["sense, magnitude and direction.","sense and direction.","magnitude only."],"answer":2,"answerText":"magnitude only.","explanation":""},{"topic":"1. Matter.","sourceNumber":70,"q":"A hydraulic piston of 2.5 square inches produces 7500lbf, What pressure is used?.","options":["5000 PSI.","3000 PSI.","7000 PSI."],"answer":1,"answerText":"3000 PSI.","explanation":"Pressure = Force/Area."},{"topic":"1. Matter.","sourceNumber":71,"q":"Forces passing through a common point are said to be.","options":["coherent.","coplanar.","concurrent."],"answer":2,"answerText":"concurrent.","explanation":""},{"topic":"1. Matter.","sourceNumber":72,"q":"A force of 5 Newtons acting perpendicularly at 300 centimetres from the pivot produces a moment of.","options":["1500 Newton metre.","15 Newton metre.","1.5 Kilonewton millimetre."],"answer":1,"answerText":"15 Newton metre.","explanation":"3m * 5N = 15 Nm."},{"topic":"1. Matter.","sourceNumber":73,"q":"Equilibrium of translation occurs when.","options":["downward forces equal upward (reactive) forces.","clockwise moments equal counterclockwise moments.","clockwise forces and counterclockwise forces are equal."],"answer":0,"answerText":"downward forces equal upward (reactive) forces.","explanation":"Translation is linear movement."},{"topic":"1. Matter.","sourceNumber":74,"q":"The conversion factor to convert litres to pints is.","options":["0.57.","1.76.","2.2."],"answer":1,"answerText":"1.76.","explanation":"NIL. http://www.thetipsbank.com/convert.htm"},{"topic":"1. Matter.","sourceNumber":75,"q":"Hydraulic pressure can be restored by.","options":["the use of pressure/heat exchange.","compressing the air charge in an accumulator.","compressing the fluid in a reservoir."],"answer":1,"answerText":"compressing the air charge in an accumulator.","explanation":""},{"topic":"1. Matter.","sourceNumber":76,"q":"When checking a hydraulic accumulator initial air pressure, the hydraulic system pressure.","options":["should be at the normal working pressure.","is not important.","should be released."],"answer":2,"answerText":"should be released.","explanation":""},{"topic":"1. Matter.","sourceNumber":77,"q":"One kg is the mass of.","options":["one litre of pure water.","one pint of pure water.","one gallon of pure water."],"answer":0,"answerText":"one litre of pure water.","explanation":"NIL. http://www.bartleby.com/68/85/3685.html"},{"topic":"1. Matter.","sourceNumber":78,"q":"The centre of gravity of a triangle is.","options":["1/3 the median from the base.","1/3 the bisector from the base.","1/3 the height from the base."],"answer":0,"answerText":"1/3 the median from the base.","explanation":"http://en.wikipedia.org/wiki/Triangle"},{"topic":"1. Matter.","sourceNumber":79,"q":"A lifting machine moves with an effort, a distance of 200 cm, in order to raise it 0.5 m. The Velocity Ratio is.","options":["0.25.","4.","40."],"answer":1,"answerText":"4.","explanation":"Distance ratio input/ output = 2/0.5 = 4. Velocity ratio is same as Distance ration."},{"topic":"1. Matter.","sourceNumber":80,"q":"Two Vectors are at 90 degrees to each other having magnitudes of 3N and 4N. The resultant is.","options":["5N.","1N.","7N."],"answer":0,"answerText":"5N.","explanation":"Vectors make a 3-4-5 triangle."},{"topic":"1. Matter.","sourceNumber":81,"q":"Which of the following has no units?.","options":["Strain.","Stress.","Elasticity."],"answer":0,"answerText":"Strain.","explanation":"NIL. 2.2. Mechanics – Kinetics."},{"topic":"1. Matter.","sourceNumber":1,"q":"For a car weighing 1000 N, what force would be required to accelerate the car to 3 ms-2.","options":["3270 N.","305.8 N.","3000 N."],"answer":1,"answerText":"305.8 N.","explanation":"F = ma F = 1000/9.81 * 3 F = 305.8 N (The 'divide by' 9.81 is necessary to convert the 1000 N into a mass (in kg))."},{"topic":"1. Matter.","sourceNumber":2,"q":"A time period of 10 microseconds is equal to a frequency of.","options":["100 kHz.","10 kHz.","1 Mhz."],"answer":0,"answerText":"100 kHz.","explanation":"Frequency = 1/time period. 1/0.00001 = 100,000 = 100 kHz."},{"topic":"1. Matter.","sourceNumber":3,"q":"The SI unit of acceleration is the.","options":["metre per second squared (m/s2).","metre per second (m/s).","square metre (m2)."],"answer":0,"answerText":"metre per second squared (m/s2).","explanation":""},{"topic":"1. Matter.","sourceNumber":4,"q":"If a body starts at rest and reaches 84 m/s in 3 seconds, its acceleration is.","options":["28 m/s2.","14 m/s2.","252 m/s2."],"answer":0,"answerText":"28 m/s2.","explanation":"Acceleration = change in speed / time."},{"topic":"1. Matter.","sourceNumber":5,"q":"The SI unit of velocity is the.","options":["metre per second squared (m/s2).","metre per second (m/s).","metre (m)."],"answer":1,"answerText":"metre per second (m/s).","explanation":""},{"topic":"1. Matter.","sourceNumber":6,"q":"An aircraft flies 1350 nmiles in 2h 15mins. What is the average speed?.","options":["600 nmiles/hour.","600 miles/hour.","150 nmiles/hour."],"answer":0,"answerText":"600 nmiles/hour.","explanation":"Average speed = distance/time = 1350/2.25 = 600 nm/h."},{"topic":"1. Matter.","sourceNumber":7,"q":"A spring extends 7 cm to the ground and back again 20 times a minute. What is the period?.","options":["7 cm.","3 seconds.","1/3 cycle."],"answer":1,"answerText":"3 seconds.","explanation":"Frequency = 20/60 = 1/3 Hz. Time period = 1/f = 3 seconds."},{"topic":"1. Matter.","sourceNumber":8,"q":"A cyclist goes from rest to 50 m/s in 5 seconds. What is the average acceleration?.","options":["10 m/s2.","12 m/s2.","8 m/s2."],"answer":0,"answerText":"10 m/s2.","explanation":"Acceleration = change in speed / time."},{"topic":"1. Matter.","sourceNumber":9,"q":"What is the period of a frequency of 4 Hz?.","options":["8 seconds.","0.25 seconds.","4 seconds."],"answer":1,"answerText":"0.25 seconds.","explanation":"Period = 1/f."},{"topic":"1. Matter.","sourceNumber":10,"q":"A dot rotates around the circumference of a circle. If the vertical position of this dot is plotted on a graph with respect to time the result will be.","options":["a linear motion.","a transverse waveform.","a sinusoidal waveform."],"answer":2,"answerText":"a sinusoidal waveform.","explanation":"This is why an AC generator produces a sine wave frequency."},{"topic":"1. Matter.","sourceNumber":11,"q":"A freely falling body, falling from a height of 2km, and 2 assuming g = 10m/s , will strike the ground in a time of.","options":["400s.","80s.","20s."],"answer":2,"answerText":"20s.","explanation":"From the equations of motion s = ut + 1/2at2. If it starts at rest u (and hence ut) is zero. Use s = 2000 m, plug in the numbers and transpose for t."},{"topic":"1. Matter.","sourceNumber":12,"q":"What is the angular velocity of a shaft rotating at 300rpm in radians/second?.","options":["10π radians/second.","2π radians/second.","5π radians/second."],"answer":0,"answerText":"10π radians/second.","explanation":"velocity = 2π(RPM)/60 = 2π * 300/60 = 10π radians/second."},{"topic":"1. Matter.","sourceNumber":13,"q":"The force that acts on a body to cause it to rotate in a circular path is called the.","options":["centripetal force.","centrifugal force.","inertia force."],"answer":0,"answerText":"centripetal force.","explanation":"Centripetal' force is the force pulling the rotating object towards the centre of rotation. 'Centrifugal' force is the equal and opposite reaction."},{"topic":"1. Matter.","sourceNumber":14,"q":"An aircraft of 2 metric tonnes uses 800 kilojoules kinetic energy to make an emergency stop. Its brakes apply a force of 10 kiloNewtons. What distance does it travel before it comes to a stop?.","options":["40m.","800m.","80m."],"answer":2,"answerText":"80m.","explanation":"Energy = Force * Distance. 800,000J = 10,000N x Distance. Distance = ??."},{"topic":"1. Matter.","sourceNumber":15,"q":"A body rotating at an angular velocity of 5 radians/sec, with a radius of 5 metres has a speed of.","options":["5π metres per second.","5 metres per second.","25 metres per second."],"answer":2,"answerText":"25 metres per second.","explanation":"velocity = Radius * Omega (Omega = radians/sec). V = 5 * 5 = 25 m/s."},{"topic":"1. Matter.","sourceNumber":16,"q":"A mass of 400 kg moves 27metres, with a force of 54N, what is the work produced?.","options":["1458 J.","583.2 KJ.","10.1 KJ."],"answer":0,"answerText":"1458 J.","explanation":"Work = Force x Distance = 54 * 27 = 1458 J. It is not moving under gravity so the 400 kg is a red herring."},{"topic":"1. Matter.","sourceNumber":17,"q":"A mass on a spring nearly hits the ground 20 times a minute, its frequency is.","options":["3 cycles per second.","1/3 cycle per second.","20 cycles per second."],"answer":1,"answerText":"1/3 cycle per second.","explanation":"cycles per minute = 20/60 cycles per second = 2/6 = 1/3 cycle per second."},{"topic":"1. Matter.","sourceNumber":18,"q":"A body travelling at 20 m/s accelerates to 36 m/s in 8 seconds, what is its acceleration?.","options":["8 m/s2.","4 m/s2.","2 m/s2."],"answer":2,"answerText":"2 m/s2.","explanation":"V = u +at 36 = 20 + 8a 36-20 = 8a 16/8 = a."},{"topic":"1. Matter.","sourceNumber":19,"q":"A body dropped from 10 m will hit the ground in.","options":["2 seconds.","0.2 seconds.","1.41 second."],"answer":2,"answerText":"1.41 second.","explanation":"s = ut + 1/2at2. Take s = 10, u = 0, a = g = 10. Calculate t. (Remember that 0 * t = 0)."},{"topic":"1. Matter.","sourceNumber":20,"q":"What is the rate of gravity?.","options":["12.7 m/s2.","0.981 m/s2.","9.81 m/s2."],"answer":2,"answerText":"9.81 m/s2.","explanation":"Gravity = 9.81 m/s2."},{"topic":"1. Matter.","sourceNumber":21,"q":"An object travels 18 km in 1 minute 30 seconds. What is its average speed?.","options":["200 m/s.","270 m/s.","100 ms."],"answer":0,"answerText":"200 m/s.","explanation":"Average speed = distance/time = 18000 metres / 90 seconds = 200 m/s."},{"topic":"1. Matter.","sourceNumber":22,"q":"100 m is approximately.","options":["220 yards.","109 yards.","66 yards."],"answer":1,"answerText":"109 yards.","explanation":"m = 3.3 ft. 100 m = 330 ft. 3 ft = 1 yd so 330/3 = 110 yards."},{"topic":"1. Matter.","sourceNumber":23,"q":"A car moves over a distance of 5 miles at steady speed in 10 minutes. What is the speed?.","options":["30 mph.","15 mph.","60 mph."],"answer":0,"answerText":"30 mph.","explanation":"in 10 mins, 10 miles in 20 mins, 15 miles in 30 mins, 30 miles in 1 hr."},{"topic":"1. Matter.","sourceNumber":24,"q":"A spaceship travels a distance of 480,000 miles in 2 days. What is its speed?.","options":["48,000 mph.","36,000 mph.","10,000 mph."],"answer":2,"answerText":"10,000 mph.","explanation":"480,000/48 = 10,000 MPH."},{"topic":"1. Matter.","sourceNumber":25,"q":"A cyclist covers a distance of 1,000 m at a constant speed in 90 seconds, What is his speed?.","options":["50 m/s.","12.5 m/s.","11.1 m/s."],"answer":2,"answerText":"11.1 m/s.","explanation":"1000m/90secs = 11.1 m/s."},{"topic":"1. Matter.","sourceNumber":26,"q":"How long will it take a car moving at 60 km/hr to travel 90 km?.","options":["40 minutes.","75 minutes.","90 minutes."],"answer":2,"answerText":"90 minutes.","explanation":"km = 1.5 * 60, therefore at 60 km/h it will take 1.5 hours = 90 mins."},{"topic":"1. Matter.","sourceNumber":27,"q":"An aircraft travels at 500 km/hr for 30 minutes at steady speed. How far does it move in that time?.","options":["500 km.","1000 km.","250 km."],"answer":2,"answerText":"250 km.","explanation":"500 km/h for 30 m/s = a distance of 250 km."},{"topic":"1. Matter.","sourceNumber":28,"q":"Which of the following affect the velocity of an object?.","options":["Speed and direction.","Speed and distance.","Speed and mass."],"answer":0,"answerText":"Speed and direction.","explanation":"Velocity is a vector (it has magnitude - speed, and direction)."},{"topic":"1. Matter.","sourceNumber":29,"q":"Acceleration involves.","options":["change in speed or direction of movement.","change of position with time.","steady speed over a fixed period of time."],"answer":0,"answerText":"change in speed or direction of movement.","explanation":"Acceleration is a vector (it has magnitude as well as direction)."},{"topic":"1. Matter.","sourceNumber":30,"q":"What acceleration is produced if a mass increases speed from rest to 10 ft/sec in 5 seconds?.","options":["2 ft/sec2.","50 ft/sec2.","0.5 ft/sec2."],"answer":0,"answerText":"2 ft/sec2.","explanation":"v = u + at' where u = 0, v = 10, t = 5, so a = v/t = 10/5 = 2."},{"topic":"1. Matter.","sourceNumber":31,"q":"A car travelling at a speed of 5 m/s accelerates at the rate of 1 m/s2. How long will it take to reach a speed of 20 m/s?.","options":["15 secs.","10 secs.","20 secs."],"answer":0,"answerText":"15 secs.","explanation":"The car gains 1 m/s every second, so to add 15 m/s it will take 15 seconds."},{"topic":"1. Matter.","sourceNumber":32,"q":"Newton’s laws of motion apply to.","options":["solid substances only.","all substances irrespective of state.","gases and liquids only."],"answer":1,"answerText":"all substances irrespective of state.","explanation":"Newtons laws apply to solids, liquids and gases."},{"topic":"1. Matter.","sourceNumber":33,"q":"Which of Newton’s Laws apply most directly to an aircraft which is accelerating down a runway?.","options":["The 3rd law.","The 2nd law.","The 1st law."],"answer":1,"answerText":"The 2nd law.","explanation":"Technically, all of Newton's laws apply but the word accelerating indicates they are looking for the second law - Force = mass x acceleration."},{"topic":"1. Matter.","sourceNumber":34,"q":"Which of Newton’s Laws apply most directly to a car which is slowing down due to the braking action?.","options":["The 1st law.","The 3rd law.","The 2nd law."],"answer":2,"answerText":"The 2nd law.","explanation":"The car is decelerating therefore it is obeying the second law - Force = mass * acceleration (but technically all three laws apply)."},{"topic":"1. Matter.","sourceNumber":35,"q":"F = ma is an equation which expresses.","options":["Newton’s 1st law.","Newton’s 2nd law.","Newton’s 3rd law."],"answer":1,"answerText":"Newton’s 2nd law.","explanation":"Newton's second law is F = ma (Force = mass * acceleration)."},{"topic":"1. Matter.","sourceNumber":36,"q":"What force is required to produce an acceleration of 5 m/s2 on a mass of 2 kg?.","options":["2.5 N.","10 N.","50 N."],"answer":1,"answerText":"10 N.","explanation":"F = ma = 2 * 5 = 10 Newtons (Force is measured in Newtons)."},{"topic":"1. Matter.","sourceNumber":37,"q":"If a force of 10 lbf produces an acceleration of 2.5 ft/sec2, on what mass is it acting?.","options":["4 slugs.","4 lb.","25 slugs."],"answer":0,"answerText":"4 slugs.","explanation":"F = ma, 10 = m * 2.5, m = 10/2.5 = 4 slugs."},{"topic":"1. Matter.","sourceNumber":38,"q":"What is acceleration?.","options":["Rate of change of velocity.","Rate of change of movement.","Rate of change of position."],"answer":0,"answerText":"Rate of change of velocity.","explanation":"Acceleration is rate of change of velocity."},{"topic":"1. Matter.","sourceNumber":39,"q":"In a gear train the driver has 100 TPI and the driven has 50 TPI.","options":["The driven rotates twice as fast.","The driver and driven rotate at the same speed.","The driven rotates half as fast."],"answer":0,"answerText":"The driven rotates twice as fast.","explanation":"smaller wheel rotates at the faster speed (of a ratio equal to their diameters)."},{"topic":"1. Matter.","sourceNumber":40,"q":"An aircraft of 2 metric tonnes lands with 400 kilojoules of energy, 10 kiloNewtons of force is applied at the brakes, how far does the aircraft take to stop?.","options":["40 M.","400 M.","800 M."],"answer":0,"answerText":"40 M.","explanation":"Work done = Force * energy. Work required to convert all the kinetic energy = Force * distance. So Force * distance = 400,000 Joules. 10,000 N * distance = 400,000. Distance = 40 m."},{"topic":"1. Matter.","sourceNumber":41,"q":"A radar rotates 1 revolution each 30 seconds and uses 10J of energy each revolution. How many joules does it use in a day?.","options":["28.8 kJ.","720 kJ.","7200 kJ."],"answer":0,"answerText":"28.8 kJ.","explanation":"=2 8 60 = 120 revs/hour = 120 8 24 = 2880 revs/day. 2880 8 10 = 28800 Joules = 28.8 kJ."},{"topic":"1. Matter.","sourceNumber":42,"q":"A light aircraft flies in a semi-circle from point A to point B. If the circle has a radius of 20km and the time taken is 30 minutes, the average speed is.","options":["125.7 km/h.","110 km/h.","80 km/h."],"answer":0,"answerText":"125.7 km/h.","explanation":"arc distance = radius x angular distance (in rads) = 20π = 60 km (approx, taking πas 3). 60 km in 30 minutes is 120 km/h (answer is slightly more because π = 3.14, not 3."},{"topic":"1. Matter.","sourceNumber":43,"q":"The landing speed of an aircraft is 54 m/s2. If the maximum 2 deceleration is 3m/s the minimum length of runway required is.","options":["162m.","486m.","360m."],"answer":1,"answerText":"486m.","explanation":""},{"topic":"1. Matter.","sourceNumber":44,"q":"The number of radians in a semi circle are.","options":["exactly 3.","π.","2π."],"answer":1,"answerText":"π.","explanation":"full circle = 2π radians, so a semicircle = π radians = 3.142."},{"topic":"1. Matter.","sourceNumber":45,"q":"The angular velocity of 500 RPM is, in rads/seconds is equal to.","options":["1000π rads/s.","8.33π rads/s.","16.66π rads/s."],"answer":2,"answerText":"16.66π rads/s.","explanation":"500 * 2π/60 = 1000π/60 = 100π/6 = 16.66."},{"topic":"1. Matter.","sourceNumber":46,"q":"Which of Newton's laws relates to the formula: Force = mass * acceleration?.","options":["1st.","2nd.","3rd."],"answer":1,"answerText":"2nd.","explanation":"Newton's Second Law F = ma."},{"topic":"1. Matter.","sourceNumber":47,"q":"The period of simple pendulum is.","options":["independent of its mass.","longer for a heavy pendulum bob.","longer on the earth than on the moon."],"answer":0,"answerText":"independent of its mass.","explanation":"The only things that affect the period of a pendulum is the length (greater length = longer period) and gravity (greater gravity= shorter period)."},{"topic":"1. Matter.","sourceNumber":48,"q":"A satellite requires 10 Joules to rotate half a revolution, which takes 30 seconds. What is the energy required for one day?.","options":["14,400 J.","1,200 J.","28,800 J."],"answer":2,"answerText":"28,800 J.","explanation":"10 Joules * 2revs/min * 60 mins * 24 hours."},{"topic":"1. Matter.","sourceNumber":49,"q":"The size of Centripetal Force on an object travelling in a circle.","options":["increase with increasing mass of the object.","decreases with increasing speed of the object.","increases with an increasing radius of circle."],"answer":0,"answerText":"increase with increasing mass of the object.","explanation":""},{"topic":"1. Matter.","sourceNumber":50,"q":"For an object in circular motion at constant velocity, if the radius of its path is doubled the centripetal force will.","options":["double.","remain the same.","half."],"answer":2,"answerText":"half.","explanation":""},{"topic":"1. Matter.","sourceNumber":51,"q":"An aircraft weighing 6400 pounds lands at a speed of 10 ft/Sec and stops in 10 Seconds. What force was generated by the brakes (assuming gravity as 32 ft/sec).","options":["-2000 Lbs.","-200 Lbs.","-640 Lbs."],"answer":1,"answerText":"-200 Lbs.","explanation":""},{"topic":"1. Matter.","sourceNumber":52,"q":"For every action there is an equal and opposite reaction.' This is known as.","options":["Newtons second law.","Newtons third law.","Newtons first law."],"answer":1,"answerText":"Newtons third law.","explanation":""},{"topic":"1. Matter.","sourceNumber":53,"q":"One radian is equal to.","options":["the angle subtended at the centre of a circle when the arc-length formed between two radial lines is equal in length to the radius.","66.67 degrees.","the angle subtended at the centre of a circle when the arc-length formed between two radial lines is equal to π."],"answer":0,"answerText":"the angle subtended at the centre of a circle when the arc-length formed between two radial lines is equal in length to the radius.","explanation":""},{"topic":"1. Matter.","sourceNumber":54,"q":"A weight on a spring almost touches the floor 7 times over 21 seconds. What is its frequency?.","options":["3 cycles/second.","1/3 cycles/second.","7 cycles/second."],"answer":1,"answerText":"1/3 cycles/second.","explanation":"Frequency = number of oscillations divided by time = 7/21 = 1/3."},{"topic":"1. Matter.","sourceNumber":55,"q":"Which of the following statements describes centrifugal force?.","options":["Equal to centripetal force and acts in the opposite direction.","Greater than centripetal force and acts in the opposite direction.","Smaller than centripetal force and acts in the opposite direction."],"answer":1,"answerText":"Greater than centripetal force and acts in the opposite direction.","explanation":"Centrifugal is away from centre and equal (but opposite) to centripetal force."},{"topic":"1. Matter.","sourceNumber":56,"q":"A body starting from rest accelerates at the rate of 20 metres per second squared. What is the distance covered until the body reaches a velocity of 50 metres per second?.","options":["0.625 kilometres.","50 metres.","62.5 metres."],"answer":2,"answerText":"62.5 metres.","explanation":""},{"topic":"1. Matter.","sourceNumber":57,"q":"The oscillation produced by a pendulum 2500mm long has a periodic time of.","options":["300 milliseconds.","3 seconds.","1.25 seconds."],"answer":1,"answerText":"3 seconds.","explanation":"T = 2xπ√L/g = √2.5/10 = 6 * √0.25 = 6 * 0.5 = 3."},{"topic":"1. Matter.","sourceNumber":58,"q":"A drive shaft has a speed 150π radians a second. What is the speed in RPM?.","options":["4500.","9000.","1500."],"answer":0,"answerText":"4500.","explanation":"150π * 60/2π = 4500. 2.3a. Mechanics – Dynamics."},{"topic":"1. Matter.","sourceNumber":1,"q":"As an object slides down a slope, its.","options":["kinetic energy increases and its potential energy increases.","kinetic energy increases and its potential energy decreases.","kinetic energy decreases and its potential energy increases."],"answer":1,"answerText":"kinetic energy increases and its potential energy decreases.","explanation":"Potential energy is converted into kinetic energy."},{"topic":"1. Matter.","sourceNumber":2,"q":"A single fixed pulley (discounting friction etc) has a mechanical advantage of.","options":["2.","1/2.","1."],"answer":2,"answerText":"1.","explanation":""},{"topic":"1. Matter.","sourceNumber":3,"q":"What is the ratio of load to effort called?.","options":["Mechanical advantage.","Velocity ratio.","Mechanical ratio."],"answer":0,"answerText":"Mechanical advantage.","explanation":""},{"topic":"1. Matter.","sourceNumber":4,"q":"1 kW is.","options":["3413 BTU per hour.","1.56 HP.","360 Joules."],"answer":0,"answerText":"3413 BTU per hour.","explanation":"1 BTU = 0.293 W. 1 W = 1/0.293 BTU = 3.413 BTU. 1 kW = 3413 BTU."},{"topic":"1. Matter.","sourceNumber":5,"q":"The tension in the cable of a crane is 2500 N and it lifts a load through 50m, what is the work done on the load?.","options":["1.25 * 10 J5.","500 J.","12.5 kJ."],"answer":0,"answerText":"1.25 * 10 J5.","explanation":""},{"topic":"1. Matter.","sourceNumber":6,"q":"What is the kinetic energy of an aircraft of mass of 2 metric tonnes and has a velocity of 2m/s?.","options":["8 kJ.","4 kJ.","2 kJ."],"answer":1,"answerText":"4 kJ.","explanation":"Kinetic energy = 1/2mV. Only the V is squared. 2 metric tonnes = 2000 kg."},{"topic":"1. Matter.","sourceNumber":7,"q":"The work done in lifting a mass of 2000 kg vertically to a height of 40 metres is.","options":["80 kJ.","784.8 kJ.","500 kJ."],"answer":1,"answerText":"784.8 kJ.","explanation":"Work done = Force * distance (force = mass * gravity). Wd = 2000 * 10 * 40 = 800,000 approx. (answer is slightly less because g = 9.81, not 10)."},{"topic":"1. Matter.","sourceNumber":8,"q":"If a machine has a mechanical advantage of 10 and a velocity ratio of 20. The efficiency of the machine is.","options":["200%.","0.5.","2."],"answer":1,"answerText":"0.5.","explanation":"10 times the force out and only 1/20th speed, it must have an efficiency of a 1/2. (100% efficient it would have 10 times the force and 1/10th the speed - straight trade of force for speed)."},{"topic":"1. Matter.","sourceNumber":9,"q":"1 Watt =.","options":["1kg/h.","1 Joule/s.","1 HP."],"answer":1,"answerText":"1 Joule/s.","explanation":"1 Watt = 1 Joule/second."},{"topic":"1. Matter.","sourceNumber":10,"q":"How would you work out the work done by a machine assuming it is 100% efficient?.","options":["Input and output.","Mechanical advantage and output.","Mechanical advantage and input."],"answer":2,"answerText":"Mechanical advantage and input.","explanation":"Assuming the 'input' means input force, to calculate the work done you will need the input force and the mechanical advantage of the machine to calculate the output force and distance (Work done = force * distance of output)."},{"topic":"1. Matter.","sourceNumber":11,"q":"Ignoring friction, if you let an object slide down a slope, at the bottom.","options":["the potential energy is equal to the kinetic energy.","the potential energy is more than the kinetic energy.","the kinetic energy is more than the potential energy."],"answer":2,"answerText":"the kinetic energy is more than the potential energy.","explanation":"All potential energy is converted to kinetic energy."},{"topic":"1. Matter.","sourceNumber":12,"q":"1 HP = 33000 ft.lbs/min or 500 ft.lbs/s or.","options":["736 Watts.","746 Watts.","1360 Watts."],"answer":1,"answerText":"746 Watts.","explanation":"1 HP = 746 Watts."},{"topic":"1. Matter.","sourceNumber":13,"q":"A force of 15N is needed to move a body of mass 30kg along a footpath with uniform velocity. Find the coefficient of dynamic friction.(take g as 10m/s/s).","options":["1/20.","1/2.","20."],"answer":0,"answerText":"1/20.","explanation":""},{"topic":"1. Matter.","sourceNumber":14,"q":"A mass of 400kg moves 27 metres with a force of 54N. What is the work produced?.","options":["10.1kJ.","583.2kJ.","1458J."],"answer":2,"answerText":"1458J.","explanation":""},{"topic":"1. Matter.","sourceNumber":15,"q":"The SI unit of Power is the.","options":["Volt.","Pascal.","Watt."],"answer":2,"answerText":"Watt.","explanation":""},{"topic":"1. Matter.","sourceNumber":16,"q":"What is 1 joule in calories?.","options":["4.186.","252.","0.239."],"answer":2,"answerText":"0.239.","explanation":""},{"topic":"1. Matter.","sourceNumber":17,"q":"If you push an object with a force of 5 N for 10 m in 4 seconds, how much power is used?.","options":["12.5 watts.","8 watts.","200 Watts."],"answer":0,"answerText":"12.5 watts.","explanation":""},{"topic":"1. Matter.","sourceNumber":18,"q":"What is the Kinetic Energy of a 2 kg object moving at a velocity of 12 m/s?.","options":["24 Joules.","288 Joules.","144 Joules."],"answer":2,"answerText":"144 Joules.","explanation":""},{"topic":"1. Matter.","sourceNumber":19,"q":"A mass of 3kg weighs approximately.","options":["0.675 N.","6.6 LB.","1.3 LB."],"answer":1,"answerText":"6.6 LB.","explanation":"1 kg = 2.2 lb. So 3 kg = 3 * 2.2 = 6.6 lb."},{"topic":"1. Matter.","sourceNumber":20,"q":"Power is the rate of doing work. It is measured in.","options":["Watts/Seconds.","Joules/Seconds.","Joules * Seconds."],"answer":1,"answerText":"Joules/Seconds.","explanation":""},{"topic":"1. Matter.","sourceNumber":21,"q":"A 6000 kg engine is lifted off a wing to a height 0.5 metres and then pushed across the hangar 24 meters. The force required to push the trolley is 12 kN. What is the work done to move the trolley?.","options":["298kJ.","84MJ.","288kJ."],"answer":2,"answerText":"288kJ.","explanation":""},{"topic":"1. Matter.","sourceNumber":22,"q":"A ball is dropped from rest. What is its speed after 4 seconds? (Take g as 10m/s/s).","options":["80m/s.","40m/s.","20m/s."],"answer":1,"answerText":"40m/s.","explanation":""},{"topic":"1. Matter.","sourceNumber":23,"q":"1 KW is equal to.","options":["1.34 HP.","1000 Joules.","252 BTU."],"answer":0,"answerText":"1.34 HP.","explanation":""},{"topic":"1. Matter.","sourceNumber":24,"q":"Ten kilograms is expressed numerically as.","options":["1 Mg.","10 K.","10 kg."],"answer":2,"answerText":"10 kg.","explanation":"10 kilograms = 10 kg."},{"topic":"1. Matter.","sourceNumber":25,"q":"An object accelerating down a slope would gain kinetic energy.","options":["less than the potential energy lost.","greater than the potential energy lost.","equal to the potential energy lost."],"answer":2,"answerText":"equal to the potential energy lost.","explanation":""},{"topic":"1. Matter.","sourceNumber":26,"q":"A block slides down a slope. Assuming there is no friction.","options":["kinetic energy is gained at the same rate as potential energy is lost.","kinetic energy is gained at a greater rate than potential energy is lost.","potential energy is gained at a greater rate than kinetic energy is lost."],"answer":0,"answerText":"kinetic energy is gained at the same rate as potential energy is lost.","explanation":"KE gained = PE lost (at the same rate)."},{"topic":"1. Matter.","sourceNumber":27,"q":"The English unit of mass is.","options":["the Newton.","the kilogram.","the slug."],"answer":2,"answerText":"the slug.","explanation":"The British unit of mass is the Slug."},{"topic":"1. Matter.","sourceNumber":28,"q":"The SI unit of energy is the.","options":["Watt (W).","Pascal (Pa).","Joule (J)."],"answer":2,"answerText":"Joule (J).","explanation":""},{"topic":"1. Matter.","sourceNumber":29,"q":"A 4.5 kW electric motor is 90% efficient. How much energy does it use in 20 seconds?.","options":["90 kJ.","2.25 kJ.","100 kJ."],"answer":2,"answerText":"100 kJ.","explanation":""},{"topic":"1. Matter.","sourceNumber":30,"q":"A pile driver of mass 1000 kg, hits a post 3 m below it. It moves the post 10 mm. Assuming gravity = 10 m/s, what is the kinetic energy of the pile driver?.","options":["30 kJ.","45 kJ.","90 kJ."],"answer":0,"answerText":"30 kJ.","explanation":""},{"topic":"1. Matter.","sourceNumber":31,"q":"The SI unit for work is the.","options":["Joule.","Watt.","horsepower."],"answer":0,"answerText":"Joule.","explanation":""},{"topic":"1. Matter.","sourceNumber":32,"q":"What work is done if a force of 100 N moves a body 15 metres?.","options":["1500 kJ.","1.5 kJ.","0.15 mJ."],"answer":1,"answerText":"1.5 kJ.","explanation":"Work = force * distance 100N * 15m = 1500J, or 1.5kJ."},{"topic":"1. Matter.","sourceNumber":33,"q":"Power is the rate of doing work. It is measured in.","options":["Joules * Seconds.","Joules/Seconds.","Watts/Seconds."],"answer":0,"answerText":"Joules/Seconds.","explanation":"Power = energy per second = Joules/second."},{"topic":"1. Matter.","sourceNumber":34,"q":"A block slides down a slope. Assuming there is no friction.","options":["potential energy is
